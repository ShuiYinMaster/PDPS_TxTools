<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>TxAgent</title>
<style>
/* ═════════════════════════════════════════════════════════════════
   变量与全局
   ═════════════════════════════════════════════════════════════════ */
:root {
    --bg: #ffffff;
    --text: #374151;
    --text-muted: #6b7280;
    --text-faint: #9ca3af;
    --primary: #3b82f6;
    --primary-dark: #2563eb;
    --border: #e5e7eb;
    --border-light: #f3f4f6;
    --user-bubble: #eff6ff;
    --assistant-bubble: #f9fafb;
    --danger: #ef4444;
    --success: #10b981;
    --warning: #f59e0b;
    --topbar-bg: #ffffff;
    --footer-bg: #ffffff;
    --code-bg: #f3f4f6;
}

* { margin: 0; padding: 0; box-sizing: border-box; }
html, body {
    height: 100%;
    font-family: "Segoe UI", "Microsoft YaHei", "PingFang SC", sans-serif;
    font-size: 14px;
    color: var(--text);
    background: var(--bg);
    -webkit-user-select: text;
}
body {
    display: flex;
    flex-direction: column;
    overflow: hidden;
}

button { font-family: inherit; }

/* ═════════════════════════════════════════════════════════════════
   顶栏
   ═════════════════════════════════════════════════════════════════ */
#topbar {
    flex: 0 0 auto;
    height: 44px;
    padding: 0 12px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 8px;
    background: var(--topbar-bg);
}
#topbar .brand {
    font-weight: 600;
    font-size: 13px;
    color: var(--text);
    letter-spacing: 0.2px;
}
#topbar select {
    padding: 4px 8px;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: #fff;
    font-size: 12px;
    cursor: pointer;
    color: var(--text);
    outline: none;
}
#topbar select:focus { border-color: var(--primary); }
#topbar .spacer { flex: 1 1 auto; }
#topbar button {
    border: 1px solid var(--border);
    background: #fff;
    padding: 5px 10px;
    border-radius: 6px;
    font-size: 12px;
    cursor: pointer;
    color: var(--text);
    transition: background 0.12s;
}
#topbar button:hover { background: var(--border-light); }

#topbar #btn-more {
    padding: 5px 8px;
    font-weight: 700;
    letter-spacing: 1px;
    line-height: 1;
}

/* 更多菜单 (⋯ 按钮弹出的浮层) */
.pop-menu {
    position: absolute;
    top: 44px;
    right: 8px;
    background: #fff;
    border: 1px solid var(--border);
    border-radius: 8px;
    box-shadow: 0 4px 16px rgba(0, 0, 0, 0.12);
    padding: 6px 0;
    min-width: 180px;
    z-index: 2500;
    display: none;
    animation: menu-in 0.12s ease-out;
}
.pop-menu.show { display: block; }
@keyframes menu-in {
    from { opacity: 0; transform: translateY(-4px); }
    to { opacity: 1; transform: translateY(0); }
}
.pop-menu .menu-item {
    padding: 7px 14px;
    display: flex;
    align-items: center;
    gap: 10px;
    cursor: pointer;
    font-size: 12px;
    color: var(--text);
    user-select: none;
}
.pop-menu .menu-item:hover { background: var(--border-light); }
.pop-menu .menu-icon {
    font-size: 14px;
    width: 18px;
    text-align: center;
    flex: 0 0 auto;
}
.pop-menu .menu-sep {
    height: 1px;
    background: var(--border);
    margin: 4px 0;
}

/* ═════════════════════════════════════════════════════════════════
   消息区
   ═════════════════════════════════════════════════════════════════ */
#chat-container {
    flex: 1 1 auto;
    overflow-y: auto;
    padding: 16px 12px;
    scroll-behavior: smooth;
}
#chat {
    display: flex;
    flex-direction: column;
    gap: 12px;
    min-height: 100%;
}

.msg {
    max-width: 88%;
    display: flex;
    flex-direction: column;
    gap: 6px;         /* 一个 msg 里多段内容/工具块之间的间距(合并气泡时用) */
}
.msg.user { align-self: flex-end; }
.msg.assistant { align-self: flex-start; max-width: 92%; }
.msg.system { align-self: center; max-width: 100%; }

.msg-label {
    font-size: 11px;
    font-weight: 600;
    margin-bottom: 3px;
    opacity: 0.55;
    letter-spacing: 0.3px;
}
.msg.user .msg-label { color: var(--text-muted); text-align: right; }
.msg.assistant .msg-label { color: var(--primary); }
.msg.system .msg-label { display: none; }

.msg-content {
    padding: 12px 16px;
    border-radius: 16px;
    word-wrap: break-word;
    overflow-wrap: break-word;
    line-height: 1.7;
}
.msg-content.empty { display: none; }         /* 无文本时不显空气泡,只留下方工具卡片 */

/* ═════════════════════════════════════════════════════════════════
   思考过程 (推理模型的 reasoning_content)
   刻意做得比正文"轻" —— 虚线框、灰字、小一号,它是过程不是结论
   ═════════════════════════════════════════════════════════════════ */
.think-block {
    margin: 6px 0 8px;
    border: 1px dashed var(--border);
    border-radius: 8px;
    background: #fafafa;
    overflow: hidden;
}
.think-head {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 7px 10px;
    cursor: pointer;
    font-size: 12px;
    color: var(--text-muted);
    user-select: none;
}
.think-head:hover { background: var(--border-light); }
.think-head .th-title { flex: 1 1 auto; }
.think-head .th-hint { font-size: 10px; opacity: 0.55; }
.think-body {
    display: none;
    padding: 8px 12px 10px;
    border-top: 1px dashed var(--border);
    font-size: 12px;
    line-height: 1.7;
    color: var(--text-muted);
    white-space: pre-wrap;
    word-break: break-word;
    max-height: 320px;
    overflow-y: auto;
}
.think-block.expanded .think-body { display: block; }
.think-block.live .th-icon { animation: think-pulse 1.3s ease-in-out infinite; }
@keyframes think-pulse {
    0%, 100% { opacity: 0.35; }
    50%      { opacity: 1; }
}
.msg.user .msg-content {
    background: var(--user-bubble);
    border-bottom-right-radius: 6px;
}
.msg.assistant .msg-content {
    background: var(--assistant-bubble);
    border-bottom-left-radius: 6px;
}
.msg.system .msg-content {
    background: transparent;
    color: var(--text-faint);
    font-size: 12px;
    text-align: center;
    padding: 4px 12px;
}

/* Markdown */
.msg-content p { margin: 0 0 8px 0; }
.msg-content p:last-child { margin-bottom: 0; }
.msg-content h1, .msg-content h2, .msg-content h3,
.msg-content h4, .msg-content h5, .msg-content h6 {
    margin: 12px 0 6px 0;
    font-weight: 600;
    line-height: 1.4;
}
.msg-content h1 { font-size: 1.4em; }
.msg-content h2 { font-size: 1.25em; }
.msg-content h3 { font-size: 1.1em; }
.msg-content ul, .msg-content ol { margin: 6px 0 8px 22px; }
.msg-content li { margin: 2px 0; }
.msg-content code {
    background: rgba(0, 0, 0, 0.06);
    padding: 1px 5px;
    border-radius: 4px;
    font-family: Consolas, "Cascadia Code", "SF Mono", monospace;
    font-size: 0.9em;
}
.msg-content pre {
    background: var(--code-bg);
    border: 1px solid var(--border);
    padding: 10px 12px;
    border-radius: 8px;
    overflow-x: auto;
    margin: 6px 0 8px 0;
}
.msg-content pre code {
    background: none;
    padding: 0;
    font-size: 0.85em;
    line-height: 1.5;
    white-space: pre;
}
.msg-content a { color: var(--primary); text-decoration: none; }
.msg-content a:hover { text-decoration: underline; }
.msg-content strong { font-weight: 600; }
.msg-content em { font-style: italic; }

/* Markdown 表格 */
.msg-content .md-table-wrap {
    overflow-x: auto;
    margin: 8px 0;
    max-width: 100%;
}
.msg-content table.md-table {
    border-collapse: collapse;
    font-size: 12px;
    line-height: 1.5;
    min-width: 100%;
}
.msg-content table.md-table th,
.msg-content table.md-table td {
    border: 1px solid var(--border);
    padding: 5px 10px;
    vertical-align: top;
    text-align: left;
    word-break: break-word;
}
.msg-content table.md-table th {
    background: #f9fafb;
    font-weight: 600;
    color: var(--text);
}
.msg-content table.md-table tr:nth-child(even) td {
    background: #fafbfc;
}
.msg-content table.md-table code {
    font-size: 11px;
    padding: 1px 4px;
}

/* 工具卡片 */
.tools-container { margin-top: 8px; display: flex; flex-direction: column; gap: 4px; }
.tool-block {
    border: 1px solid var(--border);
    border-radius: 6px;
    overflow: hidden;
    font-size: 12px;
    background: #fafafa;
}
.tool-head {
    padding: 4px 10px;
    display: flex;
    align-items: center;
    gap: 6px;
    cursor: pointer;
    user-select: none;
    min-height: 22px;
}
.tool-head:hover { background: var(--border-light); }
.tool-icon { color: var(--primary); font-weight: 600; }
.tool-name { font-weight: 500; color: var(--text); }
.tool-input {
    color: var(--text-muted);
    font-family: Consolas, monospace;
    font-size: 11px;
    margin-left: auto;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    max-width: 55%;
}
/* 折叠指示箭头: 折叠时 ▸, 展开时 ▾;给用户明确的"可点击"暗示 */
.tool-caret {
    color: var(--text-faint);
    font-size: 10px;
    width: 12px;
    text-align: center;
    flex: 0 0 auto;
    transition: transform 0.15s;
}
.tool-block:not(.collapsed) .tool-caret { transform: rotate(90deg); }
/* 完成后小 badge —— 成功/错误 */
.tool-status {
    font-size: 10px;
    padding: 1px 6px;
    border-radius: 3px;
    flex: 0 0 auto;
    display: none;
}
.tool-block.done .tool-status { display: inline-block; }
.tool-block.done.err .tool-status { background: #fee2e2; color: var(--danger); }
.tool-block.done:not(.err) .tool-status { background: #dcfce7; color: #059669; }

.tool-body {
    padding: 8px 10px;
    border-top: 1px solid var(--border);
    font-family: Consolas, monospace;
    font-size: 11px;
    line-height: 1.5;
    color: var(--text-muted);
    white-space: pre-wrap;
    word-break: break-word;
    max-height: 240px;
    overflow-y: auto;
    background: #fff;
}
.tool-body.err { color: var(--danger); background: #fef2f2; }
/* 强化优先级:collapsed 一律隐藏 body,不管 done 与否 */
.tool-block.collapsed > .tool-body { display: none !important; }
.tool-block:not(.done) .tool-icon { animation: spin 1.5s linear infinite; display: inline-block; }
@keyframes spin { to { transform: rotate(360deg); } }

/* 思考中: 三个点跳动 —— 用户消息发出到收到第一个 delta/toolCall 之间显示,避免以为界面卡了 */
.msg.thinking .msg-content {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    padding: 14px 18px;
    min-height: unset;
}
.msg.thinking .dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--text-muted);
    animation: dotbounce 1.4s infinite ease-in-out;
    opacity: 0.4;
}
.msg.thinking .dot:nth-child(2) { animation-delay: 0.2s; }
.msg.thinking .dot:nth-child(3) { animation-delay: 0.4s; }
@keyframes dotbounce {
    0%, 60%, 100% { opacity: 0.35; transform: translateY(0); }
    30% { opacity: 1; transform: translateY(-4px); }
}

/* ═════════════════════════════════════════════════════════════════
   输入区
   ═════════════════════════════════════════════════════════════════ */
#composer {
    flex: 0 0 auto;
    border-top: 1px solid var(--border);
    padding: 10px 12px 12px;
    background: var(--footer-bg);
}
/* 输入区做成一张卡片:附件、文本框、权限、上传、token、发送全部收在同一个边框里 */
#composer-card {
    border: 1px solid var(--border);
    border-radius: 14px;
    background: #fff;
    padding: 8px 10px;
    box-shadow: 0 1px 2px rgba(0, 0, 0, 0.04);
    transition: border-color 0.15s, box-shadow 0.15s;
}
#composer-card.focused {
    border-color: var(--primary);
    box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.12);
}
#attachments {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-bottom: 6px;
}
#attachments:empty { display: none; }

.att-card {
    display: flex;
    flex-direction: column;
    padding: 6px 10px;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: #f9fafb;
    font-size: 12px;
    max-width: 100%;
    min-width: 180px;
    flex: 1 1 220px;
    overflow: hidden;
    transition: border-color 0.15s;
}
.att-card.uploading { border-color: var(--warning); background: #fffbeb; }
.att-card.error { border-color: var(--danger); background: #fef2f2; }
.att-head {
    display: flex;
    align-items: center;
    gap: 6px;
    cursor: pointer;
    user-select: none;
}
.att-icon { font-size: 14px; }
.att-name {
    flex: 1 1 auto;
    font-weight: 500;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    min-width: 0;
}
.att-info {
    color: var(--text-muted);
    font-size: 11px;
    white-space: nowrap;
    flex: 0 0 auto;
}
.att-remove {
    border: none;
    background: none;
    cursor: pointer;
    color: var(--text-faint);
    padding: 0 4px;
    font-size: 14px;
    flex: 0 0 auto;
}
.att-remove:hover { color: var(--danger); }
.att-summary {
    margin-top: 6px;
    padding-top: 6px;
    border-top: 1px dashed var(--border);
    font-family: Consolas, monospace;
    font-size: 11px;
    color: var(--text-muted);
    white-space: pre-wrap;
    max-height: 120px;
    overflow-y: auto;
    display: none;
    line-height: 1.5;
}
.att-card.expanded .att-summary { display: block; }

/* 用户气泡里的附件卡片(restore 时由消息正文解析出来) */
.msg.user .att-list { display: flex; flex-direction: column; gap: 6px; margin-bottom: 8px; }
.msg.user .att-card {
    background: rgba(255, 255, 255, 0.72);
    border-color: rgba(0, 0, 0, 0.08);
    min-width: 0;
    flex: 0 0 auto;
}
.msg.user .att-summary { max-height: 220px; }
.msg.user .att-body { white-space: pre-wrap; word-break: break-word; }
.att-toggle-hint {
    font-size: 10px;
    color: var(--text-faint);
    margin-left: 4px;
    flex: 0 0 auto;
}

#input-box {
    width: 100%;
    box-sizing: border-box;
    border: none;
    outline: none;
    resize: none;
    background: transparent;
    padding: 4px 2px 2px;
    font-size: 13px;
    font-family: inherit;
    line-height: 1.55;
    color: var(--text);
    min-height: 26px;
    max-height: 180px;
    overflow-y: auto;
}
#input-box::placeholder { color: var(--text-faint); }
#input-box:disabled { background: transparent; cursor: not-allowed; }

/* 卡片底部工具条 */
#composer-bar {
    display: flex;
    align-items: center;
    gap: 6px;
    margin-top: 6px;
}
.cbar-spacer { flex: 1 1 auto; }

.cbar-btn {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    height: 28px;
    padding: 0 9px;
    border: 1px solid transparent;
    border-radius: 8px;
    background: transparent;
    color: var(--text-muted);
    font-size: 12px;
    font-family: inherit;
    cursor: pointer;
    white-space: nowrap;
    flex: 0 0 auto;
    transition: background 0.12s, color 0.12s, border-color 0.12s;
}
.cbar-btn:hover { background: var(--border-light); color: var(--text); }
.cbar-btn .caret { font-size: 9px; opacity: 0.5; }
.cbar-btn.icon-only {
    width: 28px;
    padding: 0;
    justify-content: center;
    font-size: 17px;
    line-height: 1;
}

/* 权限档位配色 —— 一眼看出当前风险等级 */
#perm-btn.mode-ask { color: var(--text-muted); }
#perm-btn.mode-auto_safe { color: #b45309; border-color: #fde68a; background: #fffbeb; }
#perm-btn.mode-auto_all { color: var(--danger); border-color: #fecaca; background: #fef2f2; }

/* 折叠态只剩一个环 —— 具体数字点开弹层看，按钮上不占位 */
#token-btn { width: 30px; padding: 0; justify-content: center; }

/* 折叠态用环形进度替代百分比数字:占位小,一眼看出余量,
   而具体数字点开弹层才需要 */
#token-ring { width: 16px; height: 16px; flex: 0 0 auto; }
/* 没有上下文数据时环整体变淡，而不是消失 —— 按钮位置保持稳定，不会左右跳 */
#token-ring.idle { opacity: 0.35; }
#token-ring circle { fill: none; stroke-width: 3; }
#token-ring .ring-bg { stroke: var(--border); }
#token-ring .ring-fg {
    stroke: var(--primary);
    stroke-linecap: round;
    transform: rotate(-90deg);
    transform-origin: 50% 50%;
    transition: stroke-dashoffset 0.3s ease, stroke 0.3s;
}
#token-ring.warn .ring-fg { stroke: #d97706; }
#token-ring.danger .ring-fg { stroke: var(--danger); }

.cbar-send {
    width: 32px;
    height: 32px;
    border-radius: 50%;
    border: none;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 15px;
    line-height: 1;
    flex: 0 0 auto;
    background: var(--primary);
    color: #fff;
    transition: background 0.12s, transform 0.1s;
}
/* 字符 ↑ 在多数中文字体里笔画很细，改用 SVG 描边，粗细可控 */
.cbar-send svg { display: block; }
.cbar-send:active { transform: scale(0.94); }
.cbar-send:hover { background: var(--primary-dark); }
.cbar-send:disabled { background: #cbd5e1; cursor: not-allowed; }
.cbar-send.stop { background: var(--danger); display: none; font-size: 11px; }
.cbar-send.stop:hover { background: #dc2626; }

/* 权限菜单锚在输入卡片左下 */
#perm-menu {
    top: auto;
    right: auto;
    bottom: 62px;
    left: 18px;
    min-width: 240px;
}
#perm-menu .menu-item { align-items: flex-start; }
#perm-menu .menu-item.active { background: #eff6ff; }
#perm-menu .pm-text { display: flex; flex-direction: column; gap: 2px; }
#perm-menu .pm-title { font-size: 12px; color: var(--text); }
#perm-menu .pm-desc { font-size: 11px; color: var(--text-faint); line-height: 1.45; }
#perm-menu .pm-check { margin-left: auto; color: var(--primary); font-size: 12px; visibility: hidden; }
#perm-menu .menu-item.active .pm-check { visibility: visible; }

/* ═════════════════════════════════════════════════════════════════
   上下文用量弹层
   ═════════════════════════════════════════════════════════════════ */
#token-pop {
    position: absolute;
    right: 16px;
    bottom: 62px;
    width: 304px;
    background: #fff;
    border: 1px solid var(--border);
    border-radius: 12px;
    box-shadow: 0 8px 28px rgba(0, 0, 0, 0.14);
    padding: 14px 16px 12px;
    z-index: 2600;
    display: none;
    animation: menu-in 0.12s ease-out;
}
#token-pop.show { display: block; }
.tp-head { display: flex; align-items: center; margin-bottom: 10px; }
.tp-head h4 { flex: 1 1 auto; margin: 0; font-size: 13px; font-weight: 600; color: var(--text); }
.tp-close {
    border: none; background: none; cursor: pointer;
    color: var(--text-faint); font-size: 16px; line-height: 1; padding: 0 2px;
}
.tp-close:hover { color: var(--text); }
.tp-main { display: flex; align-items: baseline; gap: 8px; margin-bottom: 9px; }
.tp-pct { font-size: 24px; font-weight: 700; color: var(--text); line-height: 1.1; }
.tp-used { font-size: 11px; color: var(--text-muted); }
.tp-bar {
    display: flex;
    height: 7px;
    border-radius: 4px;
    overflow: hidden;
    background: var(--border-light);
    margin-bottom: 12px;
}
.tp-bar i { display: block; height: 100%; }
.tp-row { display: flex; align-items: center; gap: 8px; font-size: 12px; padding: 3.5px 0; }
.tp-dot { width: 8px; height: 8px; border-radius: 50%; flex: 0 0 auto; }
.tp-label { flex: 1 1 auto; color: var(--text); }
.tp-val { color: var(--text-muted); font-family: Consolas, monospace; font-size: 11.5px; }
.tp-foot {
    margin-top: 10px;
    padding-top: 9px;
    border-top: 1px solid var(--border);
    font-size: 11px;
    color: var(--text-faint);
    line-height: 1.65;
}

/* ═════════════════════════════════════════════════════════════════
   状态栏
   ═════════════════════════════════════════════════════════════════ */
#status-bar {
    flex: 0 0 auto;
    height: 22px;
    padding: 0 12px;
    border-top: 1px solid var(--border);
    background: #fafafa;
    font-size: 11px;
    color: var(--text-muted);
    display: flex;
    align-items: center;
    gap: 8px;
}
#status-text {
    flex: 1 1 auto;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
}


/* 可点击的文件路径 */
.file-link {
    color: var(--primary);
    cursor: pointer;
    border-bottom: 1px dashed rgba(59, 130, 246, 0.45);
    word-break: break-all;
}
.file-link:hover {
    background: rgba(59, 130, 246, 0.08);
    border-bottom-style: solid;
}
.file-link::after {
    content: "↗";
    font-size: 0.8em;
    opacity: 0.55;
    margin-left: 2px;
}

/* ═════════════════════════════════════════════════════════════════
   Drop overlay
   ═════════════════════════════════════════════════════════════════ */
#drop-overlay {
    position: fixed;
    inset: 0;
    background: rgba(59, 130, 246, 0.1);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 1000;
    pointer-events: none;
}
#drop-overlay.show { display: flex; }
#drop-overlay .msg-box {
    background: #fff;
    border: 3px dashed var(--primary);
    padding: 24px 40px;
    border-radius: 16px;
    font-size: 15px;
    color: var(--primary);
    font-weight: 500;
    box-shadow: 0 4px 20px rgba(0, 0, 0, 0.15);
}

/* ═════════════════════════════════════════════════════════════════
   Modal (API Key)
   ═════════════════════════════════════════════════════════════════ */
.modal-mask {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.35);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 2000;
}
.modal-mask.show { display: flex; }
.modal {
    background: #fff;
    border-radius: 12px;
    padding: 20px;
    min-width: 360px;
    max-width: 520px;
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.2);
}
.modal h3 { margin-bottom: 8px; font-size: 15px; }
.modal p { color: var(--text-muted); font-size: 12px; margin-bottom: 12px; line-height: 1.6; }
.modal input[type=text], .modal input[type=password] {
    width: 100%;
    padding: 8px 10px;
    border: 1px solid var(--border);
    border-radius: 6px;
    font-size: 13px;
    margin-bottom: 10px;
    outline: none;
    font-family: Consolas, monospace;
}
.modal input:focus { border-color: var(--primary); }
.modal .row {
    display: flex;
    gap: 8px;
    justify-content: flex-end;
    margin-top: 12px;
}
.modal button {
    padding: 6px 14px;
    border: 1px solid var(--border);
    background: #fff;
    border-radius: 6px;
    cursor: pointer;
    font-size: 12px;
    color: var(--text);
}
.modal button:hover { background: var(--border-light); }
.modal button.primary {
    background: var(--primary);
    color: #fff;
    border-color: var(--primary);
}
.modal button.primary:hover { background: var(--primary-dark); }
.modal .show-toggle {
    font-size: 11px;
    color: var(--text-muted);
    user-select: none;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 4px;
}

/* 工具面板 modal */
/* 可用工具面板 —— 侧滑 drawer,跟历史对话样式一致 */
#tools-drawer-mask {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.25);
    display: none;
    z-index: 1500;
}
#tools-drawer-mask.show { display: block; }
#tools-drawer {
    position: fixed;
    top: 0;
    right: 0;
    height: 100%;
    width: 420px;
    max-width: 92vw;
    background: #fff;
    box-shadow: -4px 0 12px rgba(0, 0, 0, 0.1);
    transform: translateX(100%);
    transition: transform 0.22s ease;
    z-index: 1600;
    display: flex;
    flex-direction: column;
}
#tools-drawer.show { transform: translateX(0); }
#tools-drawer .tm-count { font-size: 12px; color: var(--text-muted); font-weight: 400; margin-left: 4px; }
#tools-drawer .tm-filter {
    margin: 10px 16px 4px;
    padding: 6px 10px;
    border: 1px solid var(--border);
    border-radius: 6px;
    font-size: 12px;
    outline: none;
    display: block;
    box-sizing: border-box;
    font-family: inherit;
}
#tools-drawer .tm-filter:focus { border-color: var(--primary); }
#tools-drawer .tm-list {
    flex: 1 1 auto;
    overflow-y: auto;
    padding: 6px 16px 14px;
}
.tool-item {
    padding: 10px 12px;
    margin: 0 -12px;
    border-bottom: 1px solid var(--border-light);
    cursor: pointer;
    border-radius: 6px;
    transition: background 0.12s;
    position: relative;
}
.tool-item:hover {
    background: var(--border-light);
}
.tool-item:hover .tool-item-cta {
    opacity: 1;
    transform: translateX(0);
}
.tool-item:last-child { border-bottom: none; }
.tool-item-head {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 3px;
}
.tool-item-name {
    font-family: Consolas, "Cascadia Code", monospace;
    font-size: 12.5px;
    font-weight: 600;
    color: var(--primary);
}
.tool-item-badge {
    font-size: 10px;
    padding: 1px 6px;
    border-radius: 4px;
    background: var(--border-light);
    color: var(--text-muted);
}
.tool-item-badge.readonly { background: #ecfdf5; color: #047857; }
.tool-item-badge.mutating { background: #fef3c7; color: #b45309; }
/* hover 时右上角出现的"填入输入框"暗示 */
.tool-item-cta {
    margin-left: auto;
    font-size: 11px;
    color: var(--primary);
    opacity: 0;
    transform: translateX(-4px);
    transition: opacity 0.15s, transform 0.15s;
    white-space: nowrap;
    flex: 0 0 auto;
}
.tool-item-desc {
    font-size: 12px;
    color: var(--text-muted);
    line-height: 1.55;
}
#tools-drawer .tm-empty {
    padding: 24px;
    text-align: center;
    color: var(--text-faint);
    font-size: 12px;
}

/* 审批 modal (通用/代码两种) */
.modal.approval-modal {
    padding: 0;
    width: 720px;
    max-width: 92vw;
    max-height: 82vh;
    display: flex;
    flex-direction: column;
}
.approval-modal .ap-head {
    padding: 12px 20px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 10px;
    background: #fffbeb;
    color: #92400e;
}
.approval-modal .ap-head-icon { font-size: 18px; }
.approval-modal .ap-head h3 { flex: 1 1 auto; font-size: 14px; margin: 0; }
.approval-modal .ap-body {
    flex: 1 1 auto;
    overflow-y: auto;
    padding: 12px 20px;
}
.approval-modal .ap-body-note {
    font-size: 12px;
    color: var(--text-muted);
    margin-bottom: 10px;
    line-height: 1.6;
}
.approval-modal .ap-code {
    background: var(--code-bg);
    border: 1px solid var(--border);
    padding: 10px 12px;
    border-radius: 6px;
    font-family: Consolas, "Cascadia Code", monospace;
    font-size: 12px;
    white-space: pre;
    overflow: auto;
    max-height: 460px;
    line-height: 1.5;
}
.approval-modal .ap-generic-row {
    display: flex;
    gap: 8px;
    margin-bottom: 6px;
    font-size: 12px;
    align-items: flex-start;
}
.approval-modal .ap-generic-label {
    flex: 0 0 60px;
    color: var(--text-muted);
    padding-top: 2px;
}
.approval-modal .ap-generic-value {
    flex: 1 1 auto;
    color: var(--text);
    word-break: break-all;
    font-family: Consolas, monospace;
    font-size: 11px;
    background: var(--border-light);
    padding: 3px 8px;
    border-radius: 4px;
}
.approval-modal .ap-generic-value.desc {
    font-family: inherit;
    font-size: 12px;
    background: transparent;
    padding: 0;
    color: var(--text-muted);
    line-height: 1.55;
}
.approval-modal .ap-foot {
    padding: 12px 20px;
    border-top: 1px solid var(--border);
    display: flex;
    justify-content: flex-end;
    gap: 8px;
}
.approval-modal .ap-foot button {
    padding: 6px 16px;
    border: 1px solid var(--border);
    border-radius: 6px;
    cursor: pointer;
    font-size: 12px;
    font-family: inherit;
}
.approval-modal .ap-deny {
    background: #fff;
    color: var(--text);
}
.approval-modal .ap-deny:hover { background: var(--border-light); }
.approval-modal .ap-allow {
    background: var(--primary);
    color: #fff;
    border-color: var(--primary);
}
.approval-modal .ap-allow:hover { background: var(--primary-dark); }

/* 审批 modal 遮罩不允许点击穿透关闭 —— 用户必须显式点允许/拒绝 */
.modal-mask.no-mask-close { }

/* ═════════════════════════════════════════════════════════════════
   ask_user modal (AI 主动提问)
   confirm: 显示 是/否 两按钮
   choice:  显示每个 option 一个按钮
   input:   显示文本框 + 提交
   ═════════════════════════════════════════════════════════════════ */
.modal.askuser-modal {
    width: 460px;
    max-width: 92vw;
    padding: 0;
}
.askuser-modal .au-head {
    padding: 12px 20px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 10px;
}
.askuser-modal .au-head-icon { font-size: 18px; }
.askuser-modal .au-head h3 { flex: 1 1 auto; font-size: 14px; margin: 0; }
.askuser-modal .au-body {
    padding: 18px 20px;
    max-height: 55vh;
    overflow-y: auto;
}
.askuser-modal .au-question {
    font-size: 13px;
    line-height: 1.6;
    color: var(--text);
    margin-bottom: 14px;
    white-space: pre-wrap;
    word-break: break-word;
}
.askuser-modal .au-choices {
    display: flex;
    flex-direction: column;
    gap: 6px;
}
.askuser-modal .au-choices button {
    padding: 8px 12px;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: #fff;
    color: var(--text);
    cursor: pointer;
    font-size: 12.5px;
    font-family: inherit;
    text-align: left;
    transition: background 0.12s, border-color 0.12s;
}
.askuser-modal .au-choices button:hover {
    background: var(--border-light);
    border-color: var(--primary);
}
.askuser-modal .au-choices button.primary {
    background: var(--primary);
    color: #fff;
    border-color: var(--primary);
}
.askuser-modal .au-choices button.primary:hover { background: var(--primary-dark); }
.askuser-modal .au-input {
    width: 100%;
    padding: 8px 10px;
    border: 1px solid var(--border);
    border-radius: 6px;
    font-size: 13px;
    font-family: inherit;
    outline: none;
    box-sizing: border-box;
}
.askuser-modal .au-input:focus { border-color: var(--primary); }
.askuser-modal .au-foot {
    padding: 10px 20px 14px;
    border-top: 1px solid var(--border);
    display: flex;
    justify-content: flex-end;
    gap: 8px;
}
.askuser-modal .au-foot button {
    padding: 6px 16px;
    border: 1px solid var(--border);
    border-radius: 6px;
    cursor: pointer;
    font-size: 12px;
    font-family: inherit;
}
.askuser-modal .au-cancel { background: #fff; color: var(--text-muted); }
.askuser-modal .au-cancel:hover { background: var(--border-light); }
.askuser-modal .au-submit {
    background: var(--primary);
    color: #fff;
    border-color: var(--primary);
}
.askuser-modal .au-submit:hover { background: var(--primary-dark); }

/* 字段化渲染:multi_choice / 带自定义的 choice / form 混合表单共用同一套外观,
   避免多选长得跟单选不是一套控件 */
.askuser-modal .au-form { display: flex; flex-direction: column; gap: 16px; }
.askuser-modal .au-field { display: flex; flex-direction: column; gap: 7px; }
.askuser-modal .au-field-label {
    font-size: 12.5px;
    font-weight: 600;
    color: var(--text);
}
.askuser-modal .au-opts { display: flex; flex-direction: column; gap: 2px; }
.askuser-modal .au-opt {
    display: flex;
    align-items: flex-start;
    gap: 9px;
    padding: 6px 8px;
    border: 1px solid transparent;
    border-radius: 6px;
    cursor: pointer;
    font-size: 12.5px;
    line-height: 1.55;
    color: var(--text);
    transition: background 0.12s;
}
.askuser-modal .au-opt:hover { background: var(--border-light); }
.askuser-modal .au-opt input { margin: 3px 0 0 0; flex: 0 0 auto; cursor: pointer; }
.askuser-modal .au-opt span { flex: 1 1 auto; word-break: break-word; }
.askuser-modal .au-bulk { display: flex; gap: 14px; padding: 2px 8px; }
.askuser-modal .au-bulk a {
    font-size: 11.5px;
    color: var(--primary);
    cursor: pointer;
    text-decoration: none;
}
.askuser-modal .au-bulk a:hover { text-decoration: underline; }
.askuser-modal .au-field .au-input { width: 100%; }
.askuser-modal textarea.au-input {
    min-height: 92px;
    resize: vertical;
    line-height: 1.6;
}
.askuser-modal .au-custom { margin-left: 26px; margin-top: 2px; }
.askuser-modal select.au-input {
    appearance: auto;
    background: #fff;
    cursor: pointer;
}

/* ═════════════════════════════════════════════════════════════════
   历史对话抽屉
   ═════════════════════════════════════════════════════════════════ */
#drawer-mask {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.25);
    display: none;
    z-index: 1500;
}
#drawer-mask.show { display: block; }
#drawer {
    position: fixed;
    top: 0;
    right: 0;
    height: 100%;
    width: 340px;
    background: #fff;
    box-shadow: -4px 0 12px rgba(0, 0, 0, 0.1);
    transform: translateX(100%);
    transition: transform 0.22s ease;
    z-index: 1600;
    display: flex;
    flex-direction: column;
}
#drawer.show { transform: translateX(0); }
.drawer-head {
    padding: 12px 16px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 8px;
}
.drawer-head h3 { flex: 1 1 auto; font-size: 14px; }
.drawer-head button {
    border: none;
    background: none;
    font-size: 16px;
    cursor: pointer;
    color: var(--text-muted);
    padding: 4px 8px;
}
.drawer-head button:hover { color: var(--text); }
.drawer-body {
    flex: 1 1 auto;
    overflow-y: auto;
    padding: 8px 0;
}
.conv-item {
    padding: 10px 16px;
    border-bottom: 1px solid var(--border-light);
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 8px;
}
.conv-item:hover { background: var(--border-light); }
.conv-info { flex: 1 1 auto; min-width: 0; }
.conv-title {
    font-size: 13px;
    color: var(--text);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
}
.conv-time { font-size: 11px; color: var(--text-faint); margin-top: 2px; }
.conv-del {
    border: none;
    background: none;
    color: var(--text-faint);
    font-size: 14px;
    cursor: pointer;
    padding: 4px 8px;
    flex: 0 0 auto;
}
.conv-del:hover { color: var(--danger); }
.conv-empty {
    padding: 24px 16px;
    color: var(--text-faint);
    text-align: center;
    font-size: 12px;
}

/* ═════════════════════════════════════════════════════════════════
   滚动条
   ═════════════════════════════════════════════════════════════════ */
::-webkit-scrollbar { width: 8px; height: 8px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: #d1d5db; border-radius: 4px; }
::-webkit-scrollbar-thumb:hover { background: #9ca3af; }
</style>
<link rel="stylesheet" href="recipe-sidebar.css">
</head>

<body>

<!-- 配方侧边栏:横向 flex 容器。聊天区 #app 与侧边栏做兄弟,min-width:0 不能省 ——
     flex 子项默认 min-width:auto,聊天区一条长消息不换行就会把侧边栏挤出可视区。 -->
<div id="shell" style="display:flex; height:100vh; overflow:hidden;">
<div id="app" style="flex:1 1 auto; min-width:0; display:flex; flex-direction:column;">

<div id="topbar">
    <span class="brand">TxAgent</span>
    <select id="model-select" title="选择模型"></select>
    <span class="spacer"></span>
    <button id="btn-new" title="新对话">+ 新对话</button>
    <button id="btn-more" title="更多">⋯</button>
</div>

<!-- 更多菜单 (弹出) -->
<div id="more-menu" class="pop-menu">
    <div class="menu-item" data-action="history">
        <span class="menu-icon">🕘</span>
        <span>历史对话</span>
    </div>
    <div class="menu-item" data-action="tools">
        <span class="menu-icon">🛠</span>
        <span>可用工具</span>
    </div>
    <div class="menu-item" data-action="extract">
        <span class="menu-icon">📚</span>
        <span>经验萃取</span>
    </div>
    <div class="menu-sep"></div>
    <div class="menu-item" data-action="key">
        <span class="menu-icon">🔑</span>
        <span>设置 API Key</span>
    </div>
</div>

<div id="chat-container">
    <div id="chat"></div>
</div>

<div id="composer">
    <div id="composer-card">
        <div id="attachments"></div>
        <input type="file" id="file-input" multiple style="display:none" />
        <textarea id="input-box" placeholder="输入消息...  (Enter 发送 · Shift+Enter 换行 · 拖入/粘贴文件上传)" rows="1"></textarea>
        <div id="composer-bar">
            <button class="cbar-btn icon-only" id="attach-btn" title="上传文件 (可拖入或粘贴)">＋</button>
            <button class="cbar-btn mode-ask" id="perm-btn" title="工具执行审批模式">
                <span id="perm-icon">🛡</span><span id="perm-label">询问</span><span class="caret">▾</span>
            </button>
            <span class="cbar-spacer"></span>
            <button class="cbar-btn" id="token-btn" title="上下文用量">
                <svg id="token-ring" viewBox="0 0 20 20" aria-hidden="true" class="idle">
                    <circle class="ring-bg" cx="10" cy="10" r="8"></circle>
                    <circle class="ring-fg" cx="10" cy="10" r="8"
                            stroke-dasharray="50.27" stroke-dashoffset="50.27"></circle>
                </svg>
            </button>
            <button id="stop-btn" class="cbar-send stop" title="停止">■</button>
            <button id="send-btn" class="cbar-send" title="发送 (Enter)">
                <svg viewBox="0 0 24 24" width="17" height="17" aria-hidden="true">
                    <path d="M12 20V5M12 5l-6.5 6.5M12 5l6.5 6.5"
                          fill="none" stroke="currentColor" stroke-width="2.6"
                          stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
            </button>
        </div>
    </div>
</div>

<!-- 权限档位菜单 (原顶栏下拉,移入输入卡片) -->
<div id="perm-menu" class="pop-menu">
    <div class="menu-item" data-mode="ask">
        <span class="menu-icon">🛡</span>
        <span class="pm-text"><span class="pm-title">询问</span><span class="pm-desc">每次变更场景前弹窗确认</span></span>
        <span class="pm-check">✓</span>
    </div>
    <div class="menu-item" data-mode="auto_safe">
        <span class="menu-icon">⚡</span>
        <span class="pm-text"><span class="pm-title">半自动</span><span class="pm-desc">代码仍弹审阅框，其余变更自动通过</span></span>
        <span class="pm-check">✓</span>
    </div>
    <div class="menu-item" data-mode="auto_all">
        <span class="menu-icon">⚠</span>
        <span class="pm-text"><span class="pm-title">全自动</span><span class="pm-desc">全部自动执行，含 run_csharp 代码</span></span>
        <span class="pm-check">✓</span>
    </div>
</div>

<!-- 上下文用量弹层 -->
<div id="token-pop">
    <div class="tp-head">
        <h4>上下文用量</h4>
        <button class="tp-close" id="tp-close">×</button>
    </div>
    <div class="tp-main">
        <span class="tp-pct" id="tp-pct">—</span>
        <span class="tp-used" id="tp-used">尚无数据</span>
    </div>
    <div class="tp-bar" id="tp-bar"></div>
    <div id="tp-list"></div>
    <div class="tp-foot" id="tp-foot"></div>
</div>

<div id="status-bar">
    <span id="status-text">初始化中...</span>
</div>

<!-- Drop overlay -->
<div id="drop-overlay">
    <div class="msg-box">📥 拖放文件到此处上传</div>
</div>

<!-- API Key modal -->
<div class="modal-mask" id="key-modal">
    <div class="modal">
        <h3>API Key</h3>
        <div id="key-reason" style="color:var(--text-muted);font-size:12px;margin-bottom:12px;line-height:1.6;"></div>
        <input type="password" id="key-input" placeholder="sk-xxxxxxxxxxxxxxxx" autocomplete="off" />
        <label class="show-toggle">
            <input type="checkbox" id="key-show" /> 显示明文
        </label>
