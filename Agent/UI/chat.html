<script>
"use strict";

// ═════════════════════════════════════════════════════════════════
//  全局状态
// ═════════════════════════════════════════════════════════════════
const state = {
    ready: false,
    keyReady: false,
    busy: false,
    attachments: [],              // 已上传成功待发送: [{id, name}]
    approvalMode: "ask",          // 当前权限档位
    tokens: {},                   // 最近一次 tokenUsage 负载
    currentThinkBlock: null,      // 本轮思考块 DOM
    currentThinkBody: null,
    currentThinkBuffer: "",
    pendingUploads: 0,            // 正在上传的文件数
    currentAssistantMsg: null,    // 当前流式渲染中的 assistant 消息 DOM
    currentAssistantContent: null,// 上面消息的 .msg-content
    currentAssistantBuffer: "",   // 累积的原始文本
    lastAssistantMsg: null,       // 最近一条 assistant 消息 (用于挂 toolCall)
    isComposing: false,           // IME 组词中
    providers: [],                // v2: 所有 provider 元数据 [{id,displayName,baseUrl,models,isLocal,keyPageUrl}]
    currentProviderId: "deepseek",// v2: 当前选中的 provider id (从 modelList 或 askApiKey 更新)
    keyModalProviderId: null,     // v2: Key modal 正在设置哪个 provider 的 key
};

// ═════════════════════════════════════════════════════════════════
//  C# 通信
// ═════════════════════════════════════════════════════════════════
function postToHost(msg) {
    try {
        window.chrome.webview.postMessage(JSON.stringify(msg));
    } catch (e) {
        console.error("postMessage failed:", e);
    }
}

// C# 调用入口 (统一为 dispatchMessage(jsonString),与 form 侧 PostJs 保持一致)
window.dispatchMessage = function (json) {
    let msg;
    try { msg = typeof json === "string" ? JSON.parse(json) : json; }
    catch (e) { console.error("dispatchMessage parse:", e); return; }

    switch (msg.type) {
        case "modelList":      onModelList(msg.items, msg.current, msg.providers, msg.currentProvider); break;
        case "keyReady":       onKeyReady(); break;
        case "askApiKey":      onAskApiKey(msg.reason); break;
        case "convList":       onConvList(msg.items); break;
        case "clear":          onClear(); break;
        case "restore":        onRestore(msg.messages); break;
        case "message":        onMessage(msg.role, msg.text); break;
        case "delta":          onDelta(msg.text); break;
        case "closeAssistant": onCloseAssistant(); break;
        case "reasoningStart": onReasoningStart(); break;
        case "reasoningDelta": onReasoningDelta(msg.text); break;
        case "reasoningEnd":   onReasoningEnd(); break;
        case "toolCall":       onToolCall(msg.name, msg.input); break;
        case "toolResult":     onToolResult(msg.name, msg.result, msg.isErr); break;
        case "status":         onStatus(msg.text); break;
        case "userTextPrefill": onUserTextPrefill(msg.text); break;
        case "busy":           onBusy(msg.value); break;
        case "tokenUsage":     onTokenUsage(msg); break;
        case "attachmentInfo": onAttachmentInfo(msg); break;
        case "toolList":       onToolList(msg.items); break;
        case "askApproval":    onAskApproval(msg); break;
        case "askUser":        onAskUser(msg); break;
        case "approvalMode":
            if (msg.value) setPermMode(msg.value, false);
            break;
    }
};

// ═════════════════════════════════════════════════════════════════
//  顶栏事件
// ═════════════════════════════════════════════════════════════════
document.getElementById("model-select").addEventListener("change", (e) => {
    const opt = e.target.selectedOptions[0];
    if (!opt) return;

    // 【必须把 providerId 一起发过去】只发模型名的话，C# 侧遇到
    // "deepseek-v4-flash" 这种跨 provider 同名模型只能猜，必然串。
    const providerId = opt.dataset.providerId || state.currentProviderId;
    const model = opt.dataset.model || opt.value;

    state.currentProviderId = providerId;
    postToHost({ type: "switchModel", model: model, providerId: providerId });
});
// ═════════════════════════════════════════════════════════════════
//  权限档位 (原顶栏下拉,现为输入卡片内的按钮 + 菜单)
// ═════════════════════════════════════════════════════════════════
const PERM_MODES = {
    ask:       { icon: "\u{1F6E1}", label: "\u8be2\u95ee",   desc: "\u6bcf\u6b21\u53d8\u66f4\u573a\u666f\u524d\u5f39\u7a97\u786e\u8ba4" },
    auto_safe: { icon: "\u26a1",     label: "\u534a\u81ea\u52a8", desc: "\u4ee3\u7801\u4ecd\u5f39\u5ba1\u9605\u6846\uff0c\u5176\u4f59\u53d8\u66f4\u81ea\u52a8\u901a\u8fc7" },
    auto_all:  { icon: "\u26a0",     label: "\u5168\u81ea\u52a8", desc: "\u5168\u90e8\u81ea\u52a8\u6267\u884c\uff0c\u542b\u4ee3\u7801" }
};

function setPermMode(mode, notifyHost) {
    if (!PERM_MODES[mode]) mode = "ask";
    state.approvalMode = mode;

    const btn = document.getElementById("perm-btn");
    btn.className = "cbar-btn mode-" + mode;
    btn.title = PERM_MODES[mode].desc;
    document.getElementById("perm-icon").textContent = PERM_MODES[mode].icon;
    document.getElementById("perm-label").textContent = PERM_MODES[mode].label;

    const items = document.querySelectorAll("#perm-menu .menu-item");
    for (let i = 0; i < items.length; i++) {
        items[i].classList.toggle("active", items[i].dataset.mode === mode);
    }

    if (notifyHost) postToHost({ type: "setApprovalMode", mode: mode });
}

document.getElementById("perm-btn").addEventListener("click", (e) => {
    e.stopPropagation();
    document.getElementById("perm-menu").classList.toggle("show");
});

document.querySelectorAll("#perm-menu .menu-item").forEach((item) => {
    item.addEventListener("click", () => {
        const mode = item.dataset.mode;
        document.getElementById("perm-menu").classList.remove("show");

        if (mode === "auto_all" && state.approvalMode !== "auto_all") {
            const ok = confirm(
                "\u786e\u8ba4\u5207\u6362\u5230\u300c\u5168\u81ea\u52a8\u300d\u5ba1\u6279\u6a21\u5f0f?\n\n" +
                "\u6b64\u6a21\u5f0f\u4e0b AI \u751f\u6210\u7684 C# \u4ee3\u7801(run_csharp)\u5c06\u76f4\u63a5\u6267\u884c,\u4e0d\u518d\u5f39\u51fa\u4ee3\u7801\u5ba1\u9605\u6846\u3002\n" +
                "AI \u53ef\u80fd\u521b\u5efa/\u4fee\u6539/\u5220\u9664\u573a\u666f\u5bf9\u8c61,\u5efa\u8bae\u4ec5\u5728\u9a8c\u8bc1\u8fc7\u7684\u4f1a\u8bdd\u4e2d\u4f7f\u7528\u3002\n\n" +
                "\u786e\u8ba4\u7ee7\u7eed?"
            );
            if (!ok) return;
        }
        setPermMode(mode, true);
    });
});

// ═════════════════════════════════════════════════════════════════
//  上下文用量弹层
// ═════════════════════════════════════════════════════════════════
const TP_PARTS = [
    { key: "system",   label: "\u7cfb\u7edf\u63d0\u793a\u8bcd", color: "#10b981" },
    { key: "tools",    label: "\u5de5\u5177\u5b9a\u4e49",       color: "#f59e0b" },
    { key: "messages", label: "\u5bf9\u8bdd\u6d88\u606f",       color: "#7c3aed" },
    { key: "other",    label: "\u5176\u5b83",                     color: "#38bdf8" }
];

document.getElementById("token-btn").addEventListener("click", (e) => {
    e.stopPropagation();
    const pop = document.getElementById("token-pop");
    const show = !pop.classList.contains("show");
    pop.classList.toggle("show", show);
    if (show) renderTokenPop();
});
document.getElementById("tp-close").addEventListener("click", () => {
    document.getElementById("token-pop").classList.remove("show");
});

function renderTokenPop() {
    const d = state.tokens || {};
    const bar = document.getElementById("tp-bar");
    const list = document.getElementById("tp-list");
    bar.innerHTML = "";
    list.innerHTML = "";

    const max = d.ctxMax || 0;
    const used = d.ctxUsed || 0;

    if (max > 0) {
        const pct = used / max * 100;
        document.getElementById("tp-pct").textContent = pct.toFixed(1) + "%";
        document.getElementById("tp-used").textContent =
            "\u5df2\u4f7f\u7528 " + fmtNum(used) + " / " + fmtNum(max);
    } else {
        document.getElementById("tp-pct").textContent = "\u2014";
        document.getElementById("tp-used").textContent = "\u5c1a\u65e0\u4e0a\u4e0b\u6587\u6570\u636e";
    }

    const parts = d.parts || {};
    let shown = 0;

    for (let i = 0; i < TP_PARTS.length; i++) {
        const p = TP_PARTS[i];
        const v = parts[p.key] || 0;
        if (v <= 0) continue;
        shown += v;

        if (max > 0) {
            const seg = document.createElement("i");
            seg.style.width = (v / max * 100) + "%";
            seg.style.background = p.color;
            bar.appendChild(seg);
        }

        const row = document.createElement("div");
        row.className = "tp-row";
        const dot = document.createElement("span");
        dot.className = "tp-dot";
        dot.style.background = p.color;
        const lab = document.createElement("span");
        lab.className = "tp-label";
        lab.textContent = p.label;
        const val = document.createElement("span");
        val.className = "tp-val";
        val.textContent = max > 0
            ? (v / max * 100).toFixed(1) + "%  \u00b7  " + fmtNum(v)
            : fmtNum(v);
        row.appendChild(dot);
        row.appendChild(lab);
        row.appendChild(val);
        list.appendChild(row);
    }

    if (shown === 0) {
        const row = document.createElement("div");
        row.className = "tp-row";
        row.innerHTML = "<span class='tp-label' style='color:var(--text-faint)'>" +
            "\u5bbf\u4e3b\u672a\u4e0b\u53d1\u5206\u9879\u6570\u636e</span>";
        list.appendChild(row);
    }

    document.getElementById("tp-foot").textContent =
        "\u672c\u4f1a\u8bdd\u7d2f\u8ba1(\u542b\u5386\u53f2)\uff1a\u8f93\u5165 " + fmtNum(d.prompt || 0) +
        " \u00b7 \u8f93\u51fa " + fmtNum(d.completion || 0) +
        " \u00b7 \u5408\u8ba1 " + fmtNum(d.total || 0) +
        (max > 0 ? "\n\u5206\u9879\u4e3a\u4f30\u7b97\u503c\uff0c\u4ec5\u4f9b\u53c2\u8003" : "");
    document.getElementById("tp-foot").style.whiteSpace = "pre-line";
}

document.getElementById("btn-new").addEventListener("click", () => {
    postToHost({ type: "newConv" });
    clearAllAttachments();
});

// ⋯ 更多菜单
document.getElementById("btn-more").addEventListener("click", (e) => {
    e.stopPropagation();
    document.getElementById("more-menu").classList.toggle("show");
});
document.addEventListener("click", (e) => {
    const menu = document.getElementById("more-menu");
    if (!menu.classList.contains("show")) return;
    if (e.target.id === "btn-more") return;
    if (menu.contains(e.target)) return;
    menu.classList.remove("show");
});

// 点击别处关掉权限菜单 / 用量弹层
document.addEventListener("click", (e) => {
    const pm = document.getElementById("perm-menu");
    if (pm.classList.contains("show") && !pm.contains(e.target) && e.target.id !== "perm-btn") {
        pm.classList.remove("show");
    }
    const tp = document.getElementById("token-pop");
    if (tp.classList.contains("show") && !tp.contains(e.target) && e.target.id !== "token-btn") {
        tp.classList.remove("show");
    }
});
document.addEventListener("keydown", (e) => {
    if (e.key === "Escape") {
        document.getElementById("more-menu").classList.remove("show");
    }
});
document.querySelectorAll("#more-menu .menu-item").forEach((item) => {
    item.addEventListener("click", () => {
        document.getElementById("more-menu").classList.remove("show");
        handleMenuAction(item.dataset.action);
    });
});

function handleMenuAction(action) {
    switch (action) {
        case "history":
            postToHost({ type: "listConvs" });
            showDrawer();
            break;
        case "tools":
            openToolsModal();
            break;
        case "extract":
            postToHost({ type: "extractLessons" });
            break;
        case "key": {
            const pid = state.currentProviderId || "deepseek";
            const prov = (state.providers || []).find(p => p.id === pid);
            openKeyModal("\u91cd\u65b0\u8bbe\u7f6e API Key",
                pid,
                prov && prov.displayName,
                prov && prov.baseUrl,
                prov && prov.keyPageUrl,
                prov && prov.isLocal);
            break;
        }
    }
}

// ═════════════════════════════════════════════════════════════════
//  消息渲染
// ═════════════════════════════════════════════════════════════════
function onModelList(items, current, providers, currentProvider) {
    // v2 协议: 有 providers 参数 → 按 provider 分组显示;
    // 老协议(items+current) 兼容: 直接扁平列
    const sel = document.getElementById("model-select");
    sel.innerHTML = "";

    if (providers && providers.length > 0) {
        state.providers = providers;
        state.currentProviderId = currentProvider || providers[0].id;
        // 【option 的 value 必须带 provider】
        // 同一个模型名会同时出现在多个 provider 下(百炼代理了 deepseek/kimi)。
        // value 只写模型名的话:
        //   · 恢复选中时 "m === current" 会把两个同名项都标 selected，
        //     浏览器只保留最后一个 —— 于是永远落在最后那个 provider 上；
        //   · change 事件里 e.target.value 也分不出是哪个组点的。
        // 用 "provider|model" 复合键，两个问题一起消失。
        for (const p of providers) {
            const g = document.createElement("optgroup");
            g.label = p.displayName + (p.isLocal ? "  (\u672c\u5730)" : "");
            for (const m of (p.models || [])) {
                const opt = document.createElement("option");
                opt.value = p.id + "|" + m;
                opt.textContent = m;
                opt.dataset.providerId = p.id;
                opt.dataset.model = m;
                if (m === current && p.id === state.currentProviderId) opt.selected = true;
                g.appendChild(opt);
            }
            sel.appendChild(g);
        }

        // 上面按 provider+model 精确匹配没命中(比如首次启动、或 provider 变了)，
        // 退回只按模型名选第一个 —— 总比一个都不选好
        if (sel.selectedIndex < 0 && current) {
            for (const o of sel.options)
                if (o.dataset.model === current) { o.selected = true; break; }
        }
    } else if (items) {
        for (const it of items) {
            const opt = document.createElement("option");
            opt.value = it;
            opt.textContent = it;
            if (it === current) opt.selected = true;
            sel.appendChild(opt);
        }
    }
}

function onKeyReady() {
    state.keyReady = true;
    closeKeyModal();
    updateSendState();
}

function onAskApiKey(msgOrReason) {
    // 兼容两种调用: 直接传 reason 字符串,或传整个 msg 对象
    let reason, providerId, providerName, baseUrl, keyPageUrl, isLocal;
    if (typeof msgOrReason === "string") {
        reason = msgOrReason;
    } else {
        reason = msgOrReason.reason;
        providerId = msgOrReason.providerId;
        providerName = msgOrReason.providerName;
        baseUrl = msgOrReason.baseUrl;
        keyPageUrl = msgOrReason.keyPageUrl;
        isLocal = msgOrReason.isLocal;
    }
    openKeyModal(reason, providerId, providerName, baseUrl, keyPageUrl, isLocal);
}

function onClear() {
    document.getElementById("chat").innerHTML = "";
    state.currentAssistantMsg = null;
    state.currentAssistantContent = null;
    state.currentAssistantBuffer = "";
    state.lastAssistantMsg = null;
}

function onRestore(messages) {
    onClear();
    if (!messages) return;
    let bubble = null;  // 当前 assistant 大气泡 —— 遇 user 消息重置
    for (const m of messages) {
        if (m.role === "user") {
            appendMessage("user", m.text);
            bubble = null;
        } else if (m.role === "assistant") {
            if (!bubble) {
                // 新一轮 —— 建大气泡,text 作为首段
                bubble = appendMessage("assistant", m.text);
            } else if (m.text) {
                // 同一轮内的后续 assistant 段 —— 在同一大气泡里追加一段 msg-content
                appendContentSegmentToMessage(bubble, m.text);
            }
            state.lastAssistantMsg = bubble;
            state.currentAssistantMsg = bubble;   // 便于后续 tool_result 匹配
            if (m.toolCalls) {
                for (const tc of m.toolCalls) {
                    const b = addToolCallToMessage(bubble, tc.name, tc.input);
                    b.dataset.tcId = tc.id || "";
                }
            }
        } else if (m.role === "tool") {
            // 挂结果到当前大气泡的对应 tool-block 上
            if (bubble) {
                addToolResultToMessage(bubble, m.name, m.result, m.isErr, m.toolCallId);
            }
        }
    }
    // 恢复完成,后续新一轮的 delta 会新建大气泡
    state.currentAssistantMsg = null;
    state.currentAssistantContent = null;
    state.currentAssistantBuffer = "";
    scrollToBottom();
}

/// 在已存在的 assistant 大气泡里追加一段新的 msg-content (文字段)
function appendContentSegmentToMessage(msgEl, text) {
    const seg = document.createElement("div");
    seg.className = "msg-content";
    seg.innerHTML = renderMarkdown(text);
    // 追加到 msg 里 —— 位置就在最末尾,天然按时序排(前面可能已经有其他 msg-content 或 tool-block)
    msgEl.appendChild(seg);
    return seg;
}

function onMessage(role, text) {
    onCloseAssistant();
    const uiRole = (role === "系统" || role === "system") ? "system"
                 : (role === "user") ? "user"
                 : "assistant";
    // user 消息 = 新一轮开始,强制关闭上一轮的 assistant 大气泡
    if (uiRole === "user") {
        state.currentAssistantMsg = null;
    }
    appendMessage(uiRole, text);
    scrollToBottom();
}

function onDelta(text) {
    hideThinking();
    onReasoningEnd();   // 正文开始即思考结束

    // 情况 1: 没有当前 assistant 大气泡 → 新建
    if (!state.currentAssistantMsg) {
        state.currentAssistantMsg = appendMessage("assistant", "");
        state.currentAssistantContent = state.currentAssistantMsg.querySelector(".msg-content");
        state.currentAssistantBuffer = "";
        state.lastAssistantMsg = state.currentAssistantMsg;
    }
    // 情况 2: 有大气泡但当前段被 onCloseAssistant 关掉了 (中间调过工具) → 在同一大气泡里追加新段
    else if (!state.currentAssistantContent) {
        const seg = document.createElement("div");
        seg.className = "msg-content";
        state.currentAssistantMsg.appendChild(seg);
        state.currentAssistantContent = seg;
        state.currentAssistantBuffer = "";
    }

    state.currentAssistantBuffer += text;
    if (state.currentAssistantContent.classList.contains("empty"))
        state.currentAssistantContent.classList.remove("empty");
    state.currentAssistantContent.innerHTML = renderMarkdownStreaming(state.currentAssistantBuffer);
    scrollToBottom();
}

// ═════════════════════════════════════════════════════════════════
//  思考过程
//
//  只有推理模型(DeepSeek reasoner 系列)会返回 reasoning_content,
//  普通模型这三个事件根本不会触发,不影响任何现有行为。
//
//  注意:思考内容【不进历史】—— API 明确禁止把 reasoning_content 回传下一轮,
//  所以它也不落盘,重开对话看不到。它是本轮的过程性信息。
// ═════════════════════════════════════════════════════════════════

function ensureAssistantBubble() {
    if (!state.currentAssistantMsg) {
        state.currentAssistantMsg = appendMessage("assistant", "");
        state.lastAssistantMsg = state.currentAssistantMsg;
    }
    return state.currentAssistantMsg;
}

function onReasoningStart() {
    hideThinking();
    if (state.currentThinkBlock) return;   // 已在思考中,不重复建块

    const msgEl = ensureAssistantBubble();

    const block = document.createElement("div");
    block.className = "think-block expanded live";

    const head = document.createElement("div");
    head.className = "think-head";

    const icon = document.createElement("span");
    icon.className = "th-icon";
    icon.textContent = "💭";

    const title = document.createElement("span");
    title.className = "th-title";
    title.textContent = "思考中…";

    const hint = document.createElement("span");
    hint.className = "th-hint";
    hint.textContent = "▾";

    head.appendChild(icon);
    head.appendChild(title);
    head.appendChild(hint);

    const body = document.createElement("div");
    body.className = "think-body";

    head.addEventListener("click", () => {
        const on = block.classList.toggle("expanded");
        hint.textContent = on ? "▾" : "▸";
    });

    block.appendChild(head);
    block.appendChild(body);
    // 按时序追加到大气泡末尾 —— 思考块会排在本轮正文之前
    msgEl.appendChild(block);

    state.currentThinkBlock = block;
    state.currentThinkBody = body;
    state.currentThinkBuffer = "";
    scrollToBottom();
}

function onReasoningDelta(text) {
    if (!text) return;
    if (!state.currentThinkBlock) onReasoningStart();

    state.currentThinkBuffer += text;
    state.currentThinkBody.textContent = state.currentThinkBuffer;

    // 思考区自己滚到底,不抢外层滚动
    state.currentThinkBody.scrollTop = state.currentThinkBody.scrollHeight;
    scrollToBottom();
}

function onReasoningEnd() {
    const block = state.currentThinkBlock;
    if (!block) return;

    block.classList.remove("live");

    // 思考结束自动收起 —— 它是过程,正文才是要看的
    block.classList.remove("expanded");

    const title = block.querySelector(".th-title");
    const hint = block.querySelector(".th-hint");
    const chars = state.currentThinkBuffer.length;
    if (title) title.textContent = "思考过程 (" + chars + " 字)";
    if (hint) hint.textContent = "▸";

    state.currentThinkBlock = null;
    state.currentThinkBody = null;
    state.currentThinkBuffer = "";
}

function onCloseAssistant() {
    // 只关闭"当前流式段落",大气泡保留 —— 下一段 delta/tool_call 会挂到同一气泡里,
    // 视觉上一整轮 assistant 回复共享一个"助手"标签 + 一个大气泡容器。
    onReasoningEnd();   // 兜底:一轮结束时思考块必须收尾,否则会一直闪
    state.currentAssistantContent = null;
    state.currentAssistantBuffer = "";
    // busy 仍在 → 空档期显示思考动画
    if (state.busy) showThinking();
}

function onToolCall(name, input) {
    hideThinking();
    // 确保大气泡存在 —— 有时 assistant 上来就调工具,没走过 onDelta
    if (!state.currentAssistantMsg) {
        state.currentAssistantMsg = appendMessage("assistant", "");
        state.lastAssistantMsg = state.currentAssistantMsg;
    }
    addToolCallToMessage(state.currentAssistantMsg, name, input);
    scrollToBottom();
}

function onToolResult(name, result, isErr) {
    if (state.currentAssistantMsg) {
        addToolResultToMessage(state.currentAssistantMsg, name, result, isErr, null);
    }
    if (state.busy) showThinking();
    scrollToBottom();
}

function onStatus(text) {
    document.getElementById("status-text").textContent = text || "";
}

// 预填输入框并聚焦(配方 promote 用:塞一句固化指令,用户确认后回车即发送)
function onUserTextPrefill(text) {
    const box = document.getElementById("input-box");
    if (box) {
        box.value = text || "";
        box.focus();
        box.dispatchEvent(new Event("input"));
    }
}

function onBusy(value) {
    state.busy = !!value;
    updateSendState();
    document.getElementById("stop-btn").style.display = value ? "flex" : "none";
    document.getElementById("send-btn").style.display = value ? "none" : "flex";
    if (value) {
        showThinking();
    } else {
        hideThinking();
        // 一轮彻底结束 —— 关闭大气泡,下一轮 delta 会新建一个
        state.currentAssistantMsg = null;
        state.currentAssistantContent = null;
        state.currentAssistantBuffer = "";
    }
}

// ═════════════════════════════════════════════════════════════════
//  思考中动画: 用户发送后到收到首个 delta/toolCall 之间显示三个跳点气泡
//  同时,在多轮 tool_call 之间的空档(工具刚返回、AI 还没输出下一段)也显示,
//  避免用户觉得界面卡了。
//
//  显示时机 (置于列表最底,总在最新一条内容之下):
//    - onBusy(true): 轮次开始
//    - onCloseAssistant + busy: 上一段 assistant 关闭但轮次未结束
//    - onToolResult + busy:     工具刚返回,AI 正在决定下一步
//  隐藏时机:
//    - onDelta:     新 delta 到达,内容显示了
//    - onToolCall:  工具卡片出现了
//    - onBusy(false): 轮次彻底结束
// ═════════════════════════════════════════════════════════════════
let _thinkingMsg = null;
function showThinking() {
    if (_thinkingMsg) {
        // 已存在 —— 移到列表最底(工具卡片之后)保证可见性
        document.getElementById("chat").appendChild(_thinkingMsg);
        scrollToBottom();
        return;
    }
    const msg = document.createElement("div");
    msg.className = "msg assistant thinking";
    msg.innerHTML =
        '<div class="msg-label">助手</div>' +
        '<div class="msg-content"><span class="dot"></span><span class="dot"></span><span class="dot"></span></div>';
    document.getElementById("chat").appendChild(msg);
    _thinkingMsg = msg;
    scrollToBottom();
}
function hideThinking() {
    if (_thinkingMsg) {
        _thinkingMsg.remove();
        _thinkingMsg = null;
    }
}

// ═════════════════════════════════════════════════════════════════
//  流式友好 markdown 渲染: 检测未闭合的 ``` 代码块并补一个尾闭合,
//  否则流式过程中大段文本会被误当代码 / 或者代码块渲染不出来,
//  restore 时看到的却是完整闭合,导致"流式和重开显示不一致"。
// ═════════════════════════════════════════════════════════════════
function renderMarkdownStreaming(text) {
    if (!text) return "";
    // 统计 ``` 出现次数,奇数 = 有一个未闭合的代码块
    const matches = text.match(/```/g);
    if (matches && (matches.length % 2 === 1)) {
        text = text + "\n```";
    }
    return renderMarkdown(text);
}

function onTokenUsage(msg) {
    state.tokens = msg || {};

    const ring = document.getElementById("token-ring");
    const fg = ring.querySelector(".ring-fg");
    const C = 2 * Math.PI * 8;   // r=8 的周长
    const total = msg.total || 0;

    if (msg.ctxMax > 0) {
        const pct = Math.max(0, Math.min(1, (msg.ctxUsed || 0) / msg.ctxMax));
        fg.setAttribute("stroke-dasharray", C.toFixed(2));
        fg.setAttribute("stroke-dashoffset", (C * (1 - pct)).toFixed(2));

        ring.classList.remove("idle");
        ring.classList.toggle("warn", pct >= 0.7 && pct < 0.9);
        ring.classList.toggle("danger", pct >= 0.9);

        document.getElementById("token-btn").title =
            "上下文用量 " + (pct * 100).toFixed(1) + "%"
            + "（" + fmtNum(msg.ctxUsed || 0) + " / " + fmtNum(msg.ctxMax) + "）"
            + "\n本会话累计 " + fmtNum(total) + " tok"
            + "\n点击查看明细";
    } else {
        // 空环 + 变淡，而不是隐藏：按钮宽度固定，工具条不会跳动
        fg.setAttribute("stroke-dashoffset", C.toFixed(2));
        ring.classList.add("idle");
        ring.classList.remove("warn", "danger");
        document.getElementById("token-btn").title =
            "本会话累计 " + fmtNum(total) + " tok\n点击查看明细";
    }

    if (document.getElementById("token-pop").classList.contains("show")) renderTokenPop();
}

function fmtNum(n) {
    if (n == null) return "0";
    if (n < 1000) return String(n);
    if (n < 1000000) return (n / 1000).toFixed(1).replace(/\.0$/, "") + "k";
    return (n / 1000000).toFixed(2).replace(/\.?0+$/, "") + "M";
}

// ═════════════════════════════════════════════════════════════════
//  消息节点构造
// ═════════════════════════════════════════════════════════════════
// ═════════════════════════════════════════════════════════════════
//  用户消息里的附件前缀
//
//  C# 的 BuildAttachmentPrefix 会把文件摘要拼进用户消息正文再发给模型。
//  实时发送时前端自己显示的是 "📎 文件名",但 restore 时读的是 C# 存的原文 ——
//  于是几千字的摘要被当成用户输入渲染成一整块大气泡。
//  这里把前缀解析回附件卡片,正文只留用户真正打的字。
// ═════════════════════════════════════════════════════════════════
const ATT_PREFIX = "[已附加文件]";
const ATT_FOOTER = "[如需精读完整内容,调用 read_uploaded_file(file_id=...)]";

function parseAttachmentPrefix(text) {
    if (!text) return null;
    if (text.indexOf(ATT_PREFIX) !== 0) return null;

    const foot = text.indexOf(ATT_FOOTER);
    if (foot < 0) return null;

    const head = text.slice(ATT_PREFIX.length, foot);
    const body = text.slice(foot + ATT_FOOTER.length).replace(/^\s+/, "");

    const files = [];
    let cur = null;
    const lines = head.split("\n");

    for (let i = 0; i < lines.length; i++) {
        const line = lines[i].replace(/\r$/, "");
        const h = line.match(/^\s*(\d+)\)\s+(.*?)\s+\((id=[^)]*)\)\s*$/);
        if (h) {
            cur = { name: h[2], meta: h[3], warn: null, summary: [] };
            files.push(cur);
            continue;
        }
        if (!cur) continue;
        if (/^\s*摘要[:：]\s*$/.test(line)) continue;
        if (/^\s*⚠/.test(line)) { cur.warn = line.trim(); continue; }
        if (line.trim() !== "") cur.summary.push(line.replace(/^ {5}/, ""));
    }

    if (files.length === 0) return null;
    return { files: files, body: body };
}

function buildAttachmentList(files) {
    const wrap = document.createElement("div");
    wrap.className = "att-list";

    for (let i = 0; i < files.length; i++) {
        const f = files[i];
        const card = document.createElement("div");
        card.className = "att-card";

        const head = document.createElement("div");
        head.className = "att-head";

        const icon = document.createElement("span");
        icon.className = "att-icon";
        icon.textContent = "📎";

        const name = document.createElement("span");
        name.className = "att-name";
        name.textContent = f.name;

        const info = document.createElement("span");
        info.className = "att-info";
        info.textContent = (f.meta || "").replace(/^id=[^,]*,\s*/, "");

        head.appendChild(icon);
        head.appendChild(name);
        head.appendChild(info);

        const hasDetail = (f.summary && f.summary.length > 0) || f.warn;
        if (hasDetail) {
            const hint = document.createElement("span");
            hint.className = "att-toggle-hint";
            hint.textContent = "▸";
            head.appendChild(hint);
            head.addEventListener("click", () => {
                const on = card.classList.toggle("expanded");
                hint.textContent = on ? "▾" : "▸";
            });
        } else {
            head.style.cursor = "default";
        }

        card.appendChild(head);

        if (hasDetail) {
            const sum = document.createElement("div");
            sum.className = "att-summary att-body";
            sum.textContent = (f.warn ? f.warn + "\n" : "") + f.summary.join("\n");
            card.appendChild(sum);
        }

        wrap.appendChild(card);
    }
    return wrap;
}

function appendMessage(uiRole, text) {
    const msg = document.createElement("div");
    msg.className = "msg " + uiRole;

    const label = document.createElement("div");
    label.className = "msg-label";
    label.textContent = uiRole === "user" ? "你"
                       : uiRole === "assistant" ? "助手" : "系统";
    msg.appendChild(label);

    const content = document.createElement("div");
    content.className = "msg-content";
    if (text) {
        const att = (uiRole === "user") ? parseAttachmentPrefix(text) : null;
        if (att) {
            // 附件前缀 → 卡片;剩下的才是用户真正输入的内容
            content.appendChild(buildAttachmentList(att.files));
            if (att.body) {
                const bodyEl = document.createElement("div");
                bodyEl.innerHTML = escapeHtml(att.body).replace(/\n/g, "<br>");
                content.appendChild(bodyEl);
            }
        } else if (uiRole === "user" || uiRole === "system") {
            // 用户/系统消息保留纯文本换行 (不做 markdown 渲染, 避免用户 * 被误解为斜体等)
            content.innerHTML = escapeHtml(text).replace(/\n/g, "<br>");
        } else {
            content.innerHTML = renderMarkdown(text);
        }
    } else {
        // 无文本 —— 气泡先隐藏(CSS display:none),后续如果收到 delta 再移除 empty 类显示。
        // 这样"仅工具调用无文本"的 assistant 消息不会显示一个空气泡。
        content.classList.add("empty");
    }
    msg.appendChild(content);

    document.getElementById("chat").appendChild(msg);
    if (uiRole === "assistant") state.lastAssistantMsg = msg;
    return msg;
}

function addToolCallToMessage(msgEl, name, input) {
    const block = document.createElement("div");
    block.className = "tool-block collapsed";      // 默认折叠
    block.dataset.tool = name;

    const head = document.createElement("div");
    head.className = "tool-head";
    head.innerHTML =
        '<span class="tool-caret">▸</span>' +
        '<span class="tool-icon">⚙</span>' +
        '<span class="tool-name"></span>' +
        '<span class="tool-status"></span>' +
        '<span class="tool-input"></span>';
    head.querySelector(".tool-name").textContent = name;
    head.querySelector(".tool-input").textContent = input || "";

    const body = document.createElement("div");
    body.className = "tool-body";
    body.textContent = "等待结果...";

    block.appendChild(head);
    block.appendChild(body);
    head.addEventListener("click", () => block.classList.toggle("collapsed"));
    // 直接挂到 msg 下(与 msg-content 平级),让文字段和工具卡片按 DOM 追加顺序时序排列
    msgEl.appendChild(block);
    return block;
}

function addToolResultToMessage(msgEl, name, result, isErr, toolCallId) {
    const blocks = msgEl.querySelectorAll(".tool-block");
    let target = null;

    // 优先按 toolCallId 匹配 (restore 时用)
    if (toolCallId) {
        for (const b of blocks) if (b.dataset.tcId === toolCallId) { target = b; break; }
    }
    // 否则按 name + 未完成
    if (!target) {
        for (let i = blocks.length - 1; i >= 0; i--) {
            if (blocks[i].dataset.tool === name && !blocks[i].classList.contains("done")) {
                target = blocks[i];
                break;
            }
        }
    }
    if (!target && blocks.length > 0) target = blocks[blocks.length - 1];
    if (!target) return;

    target.classList.add("done");
    // 保持折叠 —— 用户想看结果自行点开
    target.classList.add("collapsed");
    const body = target.querySelector(".tool-body");
    body.textContent = result || "(无输出)";
    if (isErr) {
        body.classList.add("err");
        target.classList.add("err");
    }
    // 状态徽章
    const status = target.querySelector(".tool-status");
    if (status) status.textContent = isErr ? "失败" : "已完成";
}

function scrollToBottom() {
    const c = document.getElementById("chat-container");
    c.scrollTop = c.scrollHeight;
}

// ═════════════════════════════════════════════════════════════════
//  附件卡片
// ═════════════════════════════════════════════════════════════════
function onAttachmentInfo(info) {
    // 上传失败 (info 中无 id 只有 error)
    if (info.error && !info.id) {
        state.pendingUploads = Math.max(0, state.pendingUploads - 1);
        const card = firstUploadingCard();
        if (card) {
            card.classList.remove("uploading");
            card.classList.add("error");
            card.querySelector(".att-name").textContent = "上传失败";
            card.querySelector(".att-info").textContent = info.error;
        }
        updateSendState();
        return;
    }

    // 上传成功: 转 uploading -> 正式附件
    state.pendingUploads = Math.max(0, state.pendingUploads - 1);
    let card = firstUploadingCard();
    if (!card) {
        card = createAttachmentCard();
        document.getElementById("attachments").appendChild(card);
    }
    card.classList.remove("uploading");
    card.dataset.id = info.id;
    card.querySelector(".att-name").textContent = info.name || "文件";

    const parts = [];
    if (info.sizeText) parts.push(info.sizeText);
    if (info.rowCount) parts.push(info.rowCount + "行" + (info.colCount ? "×" + info.colCount + "列" : ""));
    if (info.sheetCount) parts.push(info.sheetCount + " sheet");
    card.querySelector(".att-info").textContent = parts.join(" · ");

    const summary = card.querySelector(".att-summary");
    if (info.summary) {
        summary.textContent = info.summary;
        // 有摘要就显示"点击展开"的提示
        let hint = card.querySelector(".att-toggle-hint");
        if (!hint) {
            hint = document.createElement("span");
            hint.className = "att-toggle-hint";
            hint.textContent = "▾";
            card.querySelector(".att-head").insertBefore(hint,
                card.querySelector(".att-remove"));
        }
    }
    if (info.error) {
        card.classList.add("error");
        summary.textContent = (info.error + "\n\n" + (summary.textContent || "")).trim();
    }

    state.attachments.push({ id: info.id, name: info.name });
    updateSendState();
}

function firstUploadingCard() {
    return document.querySelector(".att-card.uploading");
}

function createAttachmentCard() {
    const div = document.createElement("div");
    div.className = "att-card uploading";
    div.innerHTML =
        '<div class="att-head">' +
            '<span class="att-icon">📎</span>' +
            '<span class="att-name">上传中...</span>' +
            '<span class="att-info"></span>' +
            '<button class="att-remove" title="移除">×</button>' +
        '</div>' +
        '<div class="att-summary"></div>';

    div.querySelector(".att-head").addEventListener("click", (ev) => {
        if (ev.target.classList.contains("att-remove")) return;
        div.classList.toggle("expanded");
        const hint = div.querySelector(".att-toggle-hint");
        if (hint) hint.textContent = div.classList.contains("expanded") ? "▴" : "▾";
    });
    div.querySelector(".att-remove").addEventListener("click", (ev) => {
        ev.stopPropagation();
        const id = div.dataset.id;
        if (id) {
            postToHost({ type: "removeAttachment", id });
            state.attachments = state.attachments.filter(a => a.id !== id);
        }
        div.remove();
        updateSendState();
    });
    return div;
}

function clearAllAttachments() {
    for (const a of state.attachments) postToHost({ type: "removeAttachment", id: a.id });
    state.attachments = [];
    document.getElementById("attachments").innerHTML = "";
    state.pendingUploads = 0;
    updateSendState();
}

// ═════════════════════════════════════════════════════════════════
//  文件上传 (点击/拖放/粘贴)
// ═════════════════════════════════════════════════════════════════
document.getElementById("attach-btn").addEventListener("click", () => {
    document.getElementById("file-input").click();
});
document.getElementById("file-input").addEventListener("change", (ev) => {
    handleFiles(ev.target.files);
    ev.target.value = ""; // 允许再次选同一个文件
});

const MAX_UPLOAD_BYTES = 20 * 1024 * 1024; // 20MB 上限

function handleFiles(fileList) {
    for (const f of fileList) {
        if (f.size > MAX_UPLOAD_BYTES) {
            alert("文件 " + f.name + " 超过 20MB, 已跳过");
            continue;
        }
        // 立即建卡显示"上传中"
        const card = createAttachmentCard();
        card.querySelector(".att-name").textContent = f.name;
        card.querySelector(".att-info").textContent = "上传中...";
        document.getElementById("attachments").appendChild(card);
        state.pendingUploads++;
        updateSendState();

        const reader = new FileReader();
        reader.onload = (ev) => {
            const dataUrl = ev.target.result;
            const idx = dataUrl.indexOf(",");
            const b64 = idx >= 0 ? dataUrl.substring(idx + 1) : dataUrl;
            postToHost({ type: "uploadFile", filename: f.name, contentBase64: b64 });
        };
        reader.onerror = () => {
            card.classList.remove("uploading");
            card.classList.add("error");
            card.querySelector(".att-name").textContent = f.name;
            card.querySelector(".att-info").textContent = "读取失败";
            state.pendingUploads = Math.max(0, state.pendingUploads - 1);
            updateSendState();
        };
        reader.readAsDataURL(f);
    }
}

// 拖放
let dragCount = 0;
document.body.addEventListener("dragenter", (e) => {
    if (!e.dataTransfer || !e.dataTransfer.types.includes("Files")) return;
    e.preventDefault();
    dragCount++;
    document.getElementById("drop-overlay").classList.add("show");
});
document.body.addEventListener("dragleave", (e) => {
    e.preventDefault();
    dragCount--;
    if (dragCount <= 0) {
        dragCount = 0;
        document.getElementById("drop-overlay").classList.remove("show");
    }
});
document.body.addEventListener("dragover", (e) => {
    if (e.dataTransfer && e.dataTransfer.types.includes("Files")) e.preventDefault();
});
document.body.addEventListener("drop", (e) => {
    if (!e.dataTransfer || !e.dataTransfer.files.length) return;
    e.preventDefault();
    dragCount = 0;
    document.getElementById("drop-overlay").classList.remove("show");
    handleFiles(e.dataTransfer.files);
});

// 从剪贴板粘贴文件
document.getElementById("input-box").addEventListener("paste", (e) => {
    if (e.clipboardData && e.clipboardData.files && e.clipboardData.files.length > 0) {
        e.preventDefault();
        handleFiles(e.clipboardData.files);
    }
});

// ═════════════════════════════════════════════════════════════════
//  输入与发送
// ═════════════════════════════════════════════════════════════════
const inputBox = document.getElementById("input-box");
const sendBtn = document.getElementById("send-btn");

inputBox.addEventListener("input", autoGrow);
inputBox.addEventListener("focus", () => {
    document.getElementById("composer-card").classList.add("focused");
});
inputBox.addEventListener("blur", () => {
    document.getElementById("composer-card").classList.remove("focused");
});
inputBox.addEventListener("compositionstart", () => { state.isComposing = true; });
inputBox.addEventListener("compositionend", () => { state.isComposing = false; });
inputBox.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey && !state.isComposing) {
        e.preventDefault();
        doSend();
    }
});
sendBtn.addEventListener("click", doSend);
document.getElementById("stop-btn").addEventListener("click", () => {
    postToHost({ type: "userStop" });
});

function autoGrow() {
    inputBox.style.height = "auto";
    inputBox.style.height = Math.min(inputBox.scrollHeight, 180) + "px";
}

function doSend() {
    if (state.busy) return;
    if (state.pendingUploads > 0) {
        onStatus("附件仍在上传,请稍候...");
        return;
    }
    const text = inputBox.value.trim();
    if (!text && state.attachments.length === 0) return;
    if (!state.keyReady) {
        openKeyModal("请先设置 API Key 才能发送");
        return;
    }

    // 前端显示用户消息 (带附件名前缀)
    let display = text;
    if (state.attachments.length > 0) {
        const names = state.attachments.map(a => "📎 " + a.name).join("\n");
        display = names + (text ? "\n\n" + text : "");
    }
    appendMessage("user", display);

    // 发到 C# (attachments 仅带 id/name,内容 C# 自己去 UploadStore 拿)
    postToHost({
        type: "userSend",
        text: text,
        attachments: state.attachments.slice()
    });

    // 清输入 & 附件
    inputBox.value = "";
    autoGrow();
    document.getElementById("attachments").innerHTML = "";
    state.attachments = [];
    updateSendState();
    scrollToBottom();
}

function updateSendState() {
    sendBtn.disabled = state.busy || state.pendingUploads > 0 || !state.keyReady;
    inputBox.disabled = state.busy;
    if (state.pendingUploads > 0) {
        // 提示等待
        // 不改 status,避免覆盖其它状态
    }
}

function openKeyModal(reason, providerId, providerName, baseUrl, keyPageUrl, isLocal) {
    // 确定要给哪个 provider 配 key(参数优先; 无则取当前)
    const pid = providerId || state.currentProviderId || "deepseek";
    state.keyModalProviderId = pid;
    const prov = (state.providers || []).find(p => p.id === pid);
    const name = providerName || (prov && prov.displayName) || pid;
    const url = baseUrl || (prov && prov.baseUrl) || "";
    const help = keyPageUrl || (prov && prov.keyPageUrl) || "";
    const local = isLocal !== undefined ? isLocal : (prov && prov.isLocal);

    // 标题
    document.querySelector("#key-modal .modal h3").textContent = name + " API Key";

    // 说明区: reason + endpoint + 获取地址
    const reasonEl = document.getElementById("key-reason");
    reasonEl.innerHTML = "";
    if (reason) {
        const r = document.createElement("div"); r.textContent = reason; reasonEl.appendChild(r);
    }
    if (url) {
        const e = document.createElement("div");
        e.style.marginTop = "4px";
        e.style.fontFamily = "Consolas, monospace";
        e.style.fontSize = "11px";
        e.style.color = "var(--text-faint)";
        e.textContent = "Endpoint: " + url;
        reasonEl.appendChild(e);
    }
    if (help) {
        const a = document.createElement("div");
        a.style.marginTop = "6px";
        a.innerHTML = '获取 Key: <a href="' + help + '" target="_blank">' + help + '</a>';
        reasonEl.appendChild(a);
    }
    if (local) {
        const l = document.createElement("div");
        l.style.marginTop = "6px";
        l.style.color = "var(--success)";
        l.style.fontSize = "11px";
        l.textContent = "本地服务, 直接留空点确定即可(无需真实 key)";
        reasonEl.appendChild(l);
    }

    document.getElementById("key-input").value = "";
    document.getElementById("key-input").placeholder = local ? "留空即可" : "sk-xxxxxxxxxxxxxxxx";
    document.getElementById("key-show").checked = false;
    document.getElementById("key-input").type = "password";
    document.getElementById("key-modal").classList.add("show");
    setTimeout(() => document.getElementById("key-input").focus(), 60);
}

function closeKeyModal() {
    document.getElementById("key-modal").classList.remove("show");
    document.getElementById("key-input").value = "";
    state.keyModalProviderId = null;
}

/**
 * 点击"可用工具"里某条时:关闭 modal,把极简调用引导 "使用 <name>: " 填入输入框,
 * 光标停在末尾方便用户补具体任务描述。极简格式为了省 token —— 工具 description
 * 已经在 tools 参数里传给了 API, prompt 里再重复一遍浪费。
 * 已有内容时追加而非覆盖。
 */
function fillInputFromTool(t) {
    if (!t) return;
    closeToolsModal();
    const input = document.getElementById("input-box");
    if (!input) return;

    const template = "使用 " + (t.name || "") + ": ";
    const cur = input.value || "";
    if (cur && cur.trim().length > 0) {
        input.value = cur.replace(/\s+$/, "") + "\n" + template;
    } else {
        input.value = template;
    }
    input.focus();
    try {
        const end = input.value.length;
        input.setSelectionRange(end, end);
    } catch {}
    input.dispatchEvent(new Event("input", { bubbles: true }));
    scrollToBottom();
}

// ═════════════════════════════════════════════════════════════════
//  ask_user modal —— AI 主动向用户提问
//  kind = confirm/choice/input,对应"是否/多选一/自由输入"三种交互
// ═════════════════════════════════════════════════════════════════
// 当前弹窗的字段读取器:每项返回 [name, value]
let auReaders = [];
let auIsForm = false;

function onAskUser(msg) {
    const qEl       = document.getElementById("au-question");
    const choicesEl = document.getElementById("au-choices");
    const inputEl   = document.getElementById("au-input");
    const formEl    = document.getElementById("au-form");
    const submitBtn = document.getElementById("au-submit");

    qEl.textContent = msg.question || "(无问题)";

    // 复位
    choicesEl.innerHTML = "";
    formEl.innerHTML = "";
    inputEl.value = "";
    choicesEl.style.display = "none";
    formEl.style.display = "none";
    inputEl.style.display = "none";
    submitBtn.style.display = "none";
    submitBtn.onclick = null;
    auReaders = [];
    auIsForm = false;

    const kind = (msg.kind || "confirm").toLowerCase();

    // ── 快捷交互:confirm 与不带自定义项的 choice,点一下即答,不用再点提交 ──
    if (kind === "confirm") {
        choicesEl.style.display = "";
        const yes = document.createElement("button");
        yes.className = "primary";
        yes.textContent = "是";
        yes.addEventListener("click", () => closeAskUserModal("yes"));
        const no = document.createElement("button");
        no.textContent = "否";
        no.addEventListener("click", () => closeAskUserModal("no"));
        choicesEl.appendChild(yes);
        choicesEl.appendChild(no);
        showAskUserModal(() => choicesEl.querySelector("button"));
        return;
    }

    if (kind === "choice" && !msg.allowCustom) {
        choicesEl.style.display = "";
        const opts = msg.options || [];
        for (let i = 0; i < opts.length; i++) {
            const btn = document.createElement("button");
            btn.textContent = opts[i];
            const val = opts[i];
            if (msg.default && val === msg.default) btn.className = "primary";
            btn.addEventListener("click", () => closeAskUserModal(val));
            choicesEl.appendChild(btn);
        }
        showAskUserModal(() => choicesEl.querySelector("button.primary") || choicesEl.querySelector("button"));
        return;
    }

    // ── 字段化渲染:multi_choice / 带自定义的 choice / input / form ──
    auIsForm = (kind === "form");
    const fields = auIsForm
        ? (msg.fields || [])
        : [{
            name: "value",
            type: kind,
            options: msg.options,
            "default": msg.default,
            allowCustom: msg.allowCustom,
            multiline: msg.multiline
          }];

    for (let i = 0; i < fields.length; i++) {
        auReaders.push(auRenderField(formEl, fields[i], auIsForm));
    }

    formEl.style.display = "";
    submitBtn.style.display = "";
    submitBtn.onclick = auSubmit;

    showAskUserModal(() => formEl.querySelector("input[type=text], textarea, select, input[type=radio], input[type=checkbox]"));
}

function auSubmit() {
    if (!auIsForm) {
        const kv = auReaders.length ? auReaders[0]() : ["value", ""];
        closeAskUserModal(kv[1]);
        return;
    }
    const obj = {};
    for (let i = 0; i < auReaders.length; i++) {
        const kv = auReaders[i]();
        obj[kv[0]] = kv[1];
    }
    closeAskUserModal(JSON.stringify(obj));
}

// 渲染一个字段,返回读取函数 () => [name, value]
function auRenderField(container, f, showLabel) {
    const name = f.name || "value";
    const type = (f.type || "input").toLowerCase();
    const opts = f.options || [];
    const dflt = f["default"] || "";

    const wrap = document.createElement("div");
    wrap.className = "au-field";
    container.appendChild(wrap);

    if (showLabel) {
        const lab = document.createElement("div");
        lab.className = "au-field-label";
        lab.textContent = f.label || name;
        wrap.appendChild(lab);
    }

    if (type === "input") {
        const el = document.createElement(f.multiline ? "textarea" : "input");
        el.className = "au-input";
        if (!f.multiline) el.type = "text";
        el.value = dflt;
        wrap.appendChild(el);
        if (!f.multiline) {
            el.addEventListener("keydown", (e) => {
                if (e.key === "Enter") { e.preventDefault(); auSubmit(); }
            });
        }
        return () => [name, (el.value || "").trim()];
    }

    if (type === "confirm") {
        const box = document.createElement("div");
        box.className = "au-opts";
        wrap.appendChild(box);
        const group = "au_" + name + "_" + Math.random().toString(36).slice(2, 8);
        const yes = auOption(box, "radio", group, "是");
        const no  = auOption(box, "radio", group, "否");
        if (String(dflt).toLowerCase() === "no") no.checked = true; else yes.checked = true;
        return () => [name, yes.checked ? "yes" : "no"];
    }

    if (type === "choice") {
        // 选项过多改用下拉,免得弹窗被撑得很长
        if (opts.length >= 8 && !f.allowCustom) {
            const sel = document.createElement("select");
            sel.className = "au-input";
            for (let i = 0; i < opts.length; i++) {
                const o = document.createElement("option");
                o.value = opts[i];
                o.textContent = opts[i];
                if (opts[i] === dflt) o.selected = true;
                sel.appendChild(o);
            }
            wrap.appendChild(sel);
            return () => [name, sel.value || ""];
        }

        const box = document.createElement("div");
        box.className = "au-opts";
        wrap.appendChild(box);

        const group = "au_" + name + "_" + Math.random().toString(36).slice(2, 8);
        const radios = [];
        for (let i = 0; i < opts.length; i++) {
            const r = auOption(box, "radio", group, opts[i]);
            if (opts[i] === dflt) r.checked = true;
            radios.push({ el: r, val: opts[i] });
        }

        let customBox = null, customRadio = null;
        if (f.allowCustom) {
            customRadio = auOption(box, "radio", group, "其他(自行填写)");
            customBox = document.createElement("input");
            customBox.type = "text";
            customBox.className = "au-input au-custom";
            customBox.addEventListener("focus", () => { customRadio.checked = true; });
            box.appendChild(customBox);
        }

        if (!radios.some(r => r.el.checked) && (!customRadio || !customRadio.checked)) {
            if (radios.length) radios[0].el.checked = true;
            else if (customRadio) customRadio.checked = true;
        }

        return () => {
            for (let i = 0; i < radios.length; i++)
                if (radios[i].el.checked) return [name, radios[i].val];
            if (customRadio && customRadio.checked)
                return [name, (customBox.value || "").trim()];
            return [name, ""];
        };
    }

    // multi_choice
    const box = document.createElement("div");
    box.className = "au-opts";
    wrap.appendChild(box);

    const boxes = [];
    for (let i = 0; i < opts.length; i++) {
        const c = auOption(box, "checkbox", null, opts[i]);
        if (opts[i] === dflt) c.checked = true;
        boxes.push({ el: c, val: opts[i] });
    }

    if (boxes.length > 5) {
        const bulk = document.createElement("div");
        bulk.className = "au-bulk";
        const a1 = document.createElement("a");
        a1.textContent = "全选";
        a1.addEventListener("click", () => boxes.forEach(b => { b.el.checked = true; }));
        const a2 = document.createElement("a");
        a2.textContent = "清空";
        a2.addEventListener("click", () => boxes.forEach(b => { b.el.checked = false; }));
        bulk.appendChild(a1);
        bulk.appendChild(a2);
        wrap.appendChild(bulk);
    }

    return () => {
        const picked = boxes.filter(b => b.el.checked).map(b => b.val);
        return [name, picked.length ? picked.join(", ") : "(未选择任何项)"];
    };
}

// 一行选项:整行可点,与单选/多选外观统一
function auOption(container, inputType, group, text) {
    const row = document.createElement("label");
    row.className = "au-opt";
    const inp = document.createElement("input");
    inp.type = inputType;
    if (group) inp.name = group;
    const span = document.createElement("span");
    span.textContent = text;
    row.appendChild(inp);
    row.appendChild(span);
    container.appendChild(row);
    return inp;
}

}

/// answer=null 视为取消;否则视为用户答复(form 模式下是 JSON 字符串)

// ═════════════════════════════════════════════════════════════════
//  Markdown 渲染 (内置简易实现,不引外部依赖)
//  支持: 段落 / 换行 / 标题 / 粗体斜体 / 行内代码 / 代码块 / 链接
//        / 无序有序列表 / 引用 / 表格(简易)
// ═════════════════════════════════════════════════════════════════
function escapeHtml(s) {
    if (s == null) return "";
    return String(s)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#39;");
}

function renderMarkdown(text) {
    if (!text) return "";
    text = escapeHtml(text);

    // 1) 代码块 ```lang\ncode``` 先取出保护,避免其内容被后续规则误解
    const codeBlocks = [];
    text = text.replace(/```([\w-]*)\n?([\s\S]*?)```/g, (m, lang, code) => {
        codeBlocks.push('<pre><code>' + code.replace(/\n$/, "") + '</code></pre>');
        return "\u0001CB" + (codeBlocks.length - 1) + "\u0001";
    });

    // 2) 行内代码 `code`
    const inlineCodes = [];
    text = text.replace(/`([^`\n]+)`/g, (m, code) => {
        inlineCodes.push('<code>' + code + '</code>');
        return "\u0001IC" + (inlineCodes.length - 1) + "\u0001";
    });

    // 3) 标题
    for (let i = 6; i >= 1; i--) {
        const re = new RegExp("^" + "#".repeat(i) + " +(.+)$", "gm");
        text = text.replace(re, "<h" + i + ">$1</h" + i + ">");
    }

    // 4) 粗体 / 斜体 (先粗后斜,避免 ** 被吃掉)
    text = text.replace(/\*\*([^\*\n]+)\*\*/g, "<strong>$1</strong>");
    text = text.replace(/(^|[^\*])\*([^\*\n]+)\*/g, "$1<em>$2</em>");

    // 5) 链接 [text](url)
    text = text.replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g,
        '<a href="$2" target="_blank" rel="noopener">$1</a>');

    // 5.5) GFM 表格
    //   | 表头1 | 表头2 |
    //   |-------|-------|
    //   | data  | data  |
    // 分隔行至少要含 -,支持 :---/---: 对齐(可选)
    text = text.replace(
        /(?:^|\n)((?:[ \t]*\|.+\|[ \t]*\n)(?:[ \t]*\|[\s|:\-]*-[\s|:\-]*\|[ \t]*\n)(?:[ \t]*\|.*\|[ \t]*\n?)*)/g,
        function (m, block) {
            const lines = block.trim().split(/\n/);
            if (lines.length < 2) return m;

            function splitRow(line) {
                let s = line.trim();
                if (s.startsWith("|")) s = s.substring(1);
                if (s.endsWith("|")) s = s.substring(0, s.length - 1);
                return s.split("|").map(function (x) { return x.trim(); });
            }

            const headers = splitRow(lines[0]);
            const aligns = splitRow(lines[1]).map(function (seg) {
                const l = seg.startsWith(":");
                const r = seg.endsWith(":");
                if (l && r) return "center";
                if (r) return "right";
                if (l) return "left";
                return null;
            });
            const rows = lines.slice(2).map(splitRow);

            let html = '<div class="md-table-wrap"><table class="md-table"><thead><tr>';
            headers.forEach(function (h, i) {
                const a = aligns[i];
                html += a ? '<th style="text-align:' + a + '">' : "<th>";
                html += h + "</th>";
            });
            html += "</tr></thead><tbody>";
            rows.forEach(function (row) {
                html += "<tr>";
                const ncols = Math.max(headers.length, row.length);
                for (let i = 0; i < ncols; i++) {
                    const a = aligns[i];
                    html += a ? '<td style="text-align:' + a + '">' : "<td>";
                    html += (row[i] != null ? row[i] : "") + "</td>";
                }
                html += "</tr>";
            });
            html += "</tbody></table></div>\n";
            return "\n" + html;
        }
    );

    // 6) 无序列表 (连续多行 - / * / +)
    text = text.replace(/(?:^[ \t]*[-*+][ \t]+.+(?:\n|$))+/gm, (m) => {
        const items = m.trim().split(/\n/)
            .map(l => "<li>" + l.replace(/^[ \t]*[-*+][ \t]+/, "") + "</li>")
            .join("");
        return "<ul>" + items + "</ul>\n";
    });

    // 7) 有序列表
    text = text.replace(/(?:^[ \t]*\d+\.[ \t]+.+(?:\n|$))+/gm, (m) => {
        const items = m.trim().split(/\n/)
            .map(l => "<li>" + l.replace(/^[ \t]*\d+\.[ \t]+/, "") + "</li>")
            .join("");
        return "<ol>" + items + "</ol>\n";
    });

    // 8) 引用 (每行以 > 开头,合并为一个 blockquote)
    text = text.replace(/(?:^&gt;[ \t]?.*(?:\n|$))+/gm, (m) => {
        const inner = m.split(/\n/).map(l => l.replace(/^&gt;[ \t]?/, "")).join("<br>");
        return "<blockquote style=\"border-left:3px solid #d1d5db;padding-left:10px;color:#6b7280;\">"
             + inner + "</blockquote>\n";
    });

    // 9) 段落 (双换行分段,块级元素独占段落)
    const parts = text.split(/\n{2,}/);
    text = parts.map(p => {
        p = p.trim();
        if (!p) return "";
        if (/^\s*<(h[1-6]|ul|ol|pre|blockquote|table|div)/.test(p)) return p;
        return "<p>" + p.replace(/\n/g, "<br>") + "</p>";
    }).join("\n");

    // 10) 复原代码块与行内代码
    text = text.replace(/\u0001CB(\d+)\u0001/g, (m, i) => codeBlocks[+i]);
    text = text.replace(/\u0001IC(\d+)\u0001/g, (m, i) => inlineCodes[+i]);

    // 11) 文件路径转成可点击链接
    text = linkifyPaths(text);

    return text;
}

// ═════════════════════════════════════════════════════════════════
//  文件路径识别
//
//  模型经常在回答里给出生成的文件路径(导出的 xlsx、截图、日志)。
//  让它可点击省掉"复制路径 → 打开资源管理器 → 粘贴"这三步。
//
//  【只在标签外的纯文本上做】renderMarkdown 此时已经生成了 HTML,
//  直接全局替换会把 <a href="..."> 里的路径也改掉,破坏结构。
//  所以按标签切分,只处理标签之间的文本片段。
//
//  【行内 code 要处理,只跳过 pre 代码块】模型给文件路径时几乎总是用反引号包起来,
//  一开始把 <code> 一并跳过,结果绝大多数路径都点不了。
//  真正该跳过的只有 <pre> 里的大段代码 —— 那里的路径通常是示例而非真实产物。
// ═════════════════════════════════════════════════════════════════

// C:\dir\file.ext 或 \\server\share\file.ext
// 要求必须有扩展名，避免把普通句子里的反斜杠误判成路径
const PATH_RE = /(?:[A-Za-z]:\\|\\\\)[^\s<>"'|?*\u0001]*[^\s<>"'|?*.,;:!)\]}\u0001]\.[A-Za-z0-9]{1,8}/g;

function linkifyPaths(html) {
    if (!html || html.indexOf("\\") < 0) return html;

    // 按标签切开：偶数段是文本，奇数段是标签
    const parts = html.split(/(<[^>]*>)/);
    let inSkip = 0;

    for (let i = 0; i < parts.length; i++) {
        const seg = parts[i];

        if (i % 2 === 1) {
            // 只跳过 <pre> 大段代码和已有链接；行内 <code> 要处理
            if (/^<(pre|a)\b/i.test(seg)) inSkip++;
            else if (/^<\/(pre|a)>/i.test(seg)) inSkip = Math.max(0, inSkip - 1);
            continue;
        }

        if (inSkip > 0 || !seg) continue;

        parts[i] = seg.replace(PATH_RE, (m) => {
            const attr = m.replace(/"/g, "&quot;");
            return '<span class="file-link" data-path="' + attr + '" title="点击打开">' + m + "</span>";
        });
    }

    return parts.join("");
}

// 事件委托：气泡是动态生成的，逐个绑定会漏
document.addEventListener("click", (e) => {
    const el = e.target.closest ? e.target.closest(".file-link") : null;
    if (!el) return;
    const path = el.getAttribute("data-path");
    if (!path) return;
    e.preventDefault();
    postToHost({ type: "openPath", path: path });
});

// ═════════════════════════════════════════════════════════════════

// 全局错误捕获 —— JS 崩溃时直接在状态栏显示,不至于让 UI 静默"卡住"
window.onerror = function (msg, src, line, col, err) {
    try {
        const s = document.getElementById("status-text");
        if (s) s.textContent = "JS \u9519\u8bef @L" + line + ": " + msg;
    } catch (e) { }
    console.error("[TxAgent] Global error:", msg, "at", src + ":" + line + ":" + col, err);
    return false;
};
window.addEventListener("unhandledrejection", function (ev) {
    try {
        const s = document.getElementById("status-text");
        if (s) s.textContent = "Promise \u9519\u8bef: " + (ev.reason && ev.reason.message || ev.reason);
    } catch (e) { }
    console.error("[TxAgent] Unhandled rejection:", ev.reason);
});

try {
    onStatus("JS \u5df2\u542f\u52a8, \u901a\u77e5 C# \u5c31\u7eea...");
    autoGrow();
    updateSendState();

    // 检查 WebView2 桥是否可用
    if (!window.chrome || !window.chrome.webview) {
        onStatus("\u672a\u68c0\u6d4b\u5230 WebView2 \u6865 (window.chrome.webview \u4e0d\u5b58\u5728)\u3002\u8bf7\u5347\u7ea7 WebView2 Runtime\u3002");
    } else {
        postToHost({ type: "jsReady" });

        // 3 秒兜底自检: 若 C# 侧一直没送 modelList 回来,说明双向通信没建立
        setTimeout(function () {
            const sel = document.getElementById("model-select");
            if (sel && sel.options.length === 0) {
                onStatus("\u25b2 C# \u672a\u54cd\u5e94 jsReady\u3002\u6309 F12 \u6253\u5f00\u5f00\u53d1\u8005\u5de5\u5177 \u2192 Console \u770b\u9519\u8bef; \u5e76\u68c0\u67e5 chat.html \u662f\u5426\u5728\u63d2\u4ef6\u76ee\u5f55 Agent\\UI \u4e0b\u3002");
                // 顶部再来个红色提示条,更醒目
                const banner = document.createElement("div");
                banner.style.cssText = "background:#fef2f2;color:#b91c1c;padding:8px 12px;font-size:12px;border-bottom:1px solid #fecaca;text-align:center;";
                banner.textContent = "\u26a0 \u4e0e C# \u4e3b\u673a\u901a\u4fe1\u672a\u5efa\u7acb (3\u79d2)\u3002\u6309 F12 \u6253\u5f00 DevTools \u3002 Console \u67e5\u770b\u9519\u8bef,\u6216\u91cd\u542f\u63d2\u4ef6\u3002";
                document.body.insertBefore(banner, document.body.firstChild);
            }
        }, 3000);
    }
} catch (e) {
    onStatus("\u542f\u52a8\u5f02\u5e38: " + e.message);
    console.error("[TxAgent] Startup error:", e);
}

            if (msg && msg.type && msg.type.indexOf("recipe.") === 0) {
                if (window.txRecipes) { window.txRecipes.onHostMessage(msg); }
                return;
            }
        } catch (err) { console.error("recipe message parse:", err); }
    });
}
</script>
