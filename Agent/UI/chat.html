<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>TxAgent</title>
<style>
/* ═════════════════════════════════════════════════════════════════
   变量与全局
   ═════════════════════════════════════════════════════════════════ */
:root {
    --bg: #ffffff;
    --text: #374151;
    --text-muted: #6b7280;
    --text-faint: #9ca3af;
    --primary: #3b82f6;
    --primary-dark: #2563eb;
    --border: #e5e7eb;
    --border-light: #f3f4f6;
    --user-bubble: #eff6ff;
    --assistant-bubble: #f9fafb;
    --danger: #ef4444;
    --success: #10b981;
    --warning: #f59e0b;
    --topbar-bg: #ffffff;
    --footer-bg: #ffffff;
    --code-bg: #f3f4f6;
    --model-picker-width: 220px;
    --model-menu-width: 300px;
}

* { margin: 0; padding: 0; box-sizing: border-box; }
html, body {
    height: 100%;
    font-family: "Segoe UI", "Microsoft YaHei", "PingFang SC", sans-serif;
    font-size: 14px;
    color: var(--text);
    background: var(--bg);
    -webkit-user-select: text;
}
body {
    display: flex;
    flex-direction: column;
    overflow: hidden;
}

button { font-family: inherit; }

/* ═════════════════════════════════════════════════════════════════
   顶栏
   ═════════════════════════════════════════════════════════════════ */
#topbar {
    flex: 0 0 auto;
    height: 44px;
    padding: 0 8px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 8px;
    background: var(--topbar-bg);
}
#topbar .brand {
    font-weight: 600;
    font-size: 13px;
    color: var(--text);
    letter-spacing: 0.2px;
}
#topbar select {
    padding: 4px 8px;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: #fff;
    font-size: 12px;
    cursor: pointer;
    color: var(--text);
    outline: none;
}
#topbar select:focus { border-color: var(--primary); }
#topbar .spacer { flex: 1 1 auto; }
#topbar button {
    border: 1px solid var(--border);
    background: #fff;
    padding: 5px 10px;
    border-radius: 6px;
    font-size: 12px;
    cursor: pointer;
    color: var(--text);
    transition: background 0.12s;
}
#topbar button:hover { background: var(--border-light); }

#topbar #btn-more {
    padding: 5px 8px;
    font-weight: 700;
    letter-spacing: 1px;
    line-height: 1;
}

/* 图片选项采用自定义列表；隐藏 select 保留供应商+模型的复合键和切换协议。 */
#model-picker { min-width: 0; width: var(--model-picker-width); max-width: var(--model-picker-width); flex: 0 1 var(--model-picker-width); }
#model-select { display: none; }
#topbar #model-trigger { display: flex; align-items: center; gap: 7px; width: 100%; min-width: 0; text-align: left; }
#model-trigger:focus-visible, .model-option:focus-visible { outline: 2px solid var(--primary); outline-offset: 1px; }
.model-logo { width: 18px; height: 18px; flex: 0 0 18px; object-fit: contain; }
.model-label { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; }
.model-chevron { font-size: 10px; color: var(--text-muted); }
#model-menu {
    position: fixed; z-index: 2600; width: min(var(--model-menu-width), calc(100vw - 16px));
    max-height: min(420px, calc(100vh - 60px)); overflow-y: auto; padding: 5px;
    border: 1px solid var(--border); border-radius: 8px; background: var(--bg);
    box-shadow: 0 6px 20px rgba(0,0,0,.14);
}
#model-menu[hidden] { display: none; }
.model-group-title { font-size: 11px; font-weight: 600; color: var(--text-muted); padding: 8px 8px 4px; }
#topbar .model-option {
    display: flex; align-items: center; gap: 8px; width: 100%; padding: 8px;
    border: none; border-radius: 5px; text-align: left; background: transparent;
}
#topbar .model-option[aria-selected="true"] { background: var(--user-bubble); color: var(--primary-dark); }
.model-check { width: 14px; flex: 0 0 14px; color: var(--primary); }

/* 更多菜单 (⋯ 按钮弹出的浮层) */
.pop-menu {
    position: absolute;
    top: 44px;
    right: 8px;
    background: #fff;
    border: 1px solid var(--border);
    border-radius: 8px;
    box-shadow: 0 4px 16px rgba(0, 0, 0, 0.12);
    padding: 6px 0;
    min-width: 180px;
    z-index: 2500;
    display: none;
    animation: menu-in 0.12s ease-out;
}
.pop-menu.show { display: block; }
@keyframes menu-in {
    from { opacity: 0; transform: translateY(-4px); }
    to { opacity: 1; transform: translateY(0); }
}
.pop-menu .menu-item {
    padding: 7px 14px;
    display: flex;
    align-items: center;
    gap: 10px;
    cursor: pointer;
    font-size: 12px;
    color: var(--text);
    user-select: none;
}
.pop-menu .menu-item:hover { background: var(--border-light); }
.pop-menu .menu-icon {
    font-size: 14px;
    width: 18px;
    text-align: center;
    flex: 0 0 auto;
}
.pop-menu .menu-sep {
    height: 1px;
    background: var(--border);
    margin: 4px 0;
}

/* ═════════════════════════════════════════════════════════════════
   消息区
   ═════════════════════════════════════════════════════════════════ */
#chat-container {
    flex: 1 1 auto;
    overflow-y: auto;
    padding: 8px 8px;
    scroll-behavior: smooth;
}
#chat {
    display: flex;
    flex-direction: column;
    gap: 12px;
    min-height: 100%;
}

.msg {
    max-width: 88%;
    display: flex;
    flex-direction: column;
    gap: 6px;         /* 一个 msg 里多段内容/工具块之间的间距(合并气泡时用) */
}
.msg.user { align-self: flex-end; }
.msg.assistant { align-self: flex-start; max-width: 92%; }
.msg.system { align-self: center; max-width: 100%; }

.msg-label {
    font-size: 11px;
    font-weight: 600;
    margin-bottom: 3px;
    opacity: 0.55;
    letter-spacing: 0.3px;
}
.msg.user .msg-label { color: var(--text-muted); text-align: right; }
.msg.assistant .msg-label { color: var(--primary); }
.msg.system .msg-label { display: none; }

.msg-content {
    padding: 12px 16px;
    border-radius: 16px;
    word-wrap: break-word;
    overflow-wrap: break-word;
    line-height: 1.7;
}
.msg-content.empty { display: none; }         /* 无文本时不显空气泡,只留下方工具卡片 */

/* 消息操作按钮(复制/撤销)。
   AI 回复的复制按钮常驻气泡底部,用户侧保持悬停显现(撤销按钮),
   避免内容一多就找不到复制入口。 */
.msg-actions {
    display: flex;
    gap: 6px;
    justify-content: flex-start;
    opacity: 0;
    transition: opacity 0.15s;
    margin-top: 2px;
}
.msg.assistant .msg-actions { opacity: 1; }
.msg:hover .msg-actions { opacity: 1; }
.msg.user .msg-actions { justify-content: flex-end; }
.msg-action-btn {
    background: none;
    border: 1px solid var(--border);
    border-radius: 5px;
    color: var(--text-muted);
    font-size: 11px;
    padding: 1px 8px;
    cursor: pointer;
    line-height: 1.6;
}
.msg-action-btn:hover { border-color: var(--primary); color: var(--primary); }
.msg-action-btn.undo:hover { border-color: var(--danger); color: var(--danger); }
.msg-action-btn:disabled { opacity: 0.4; cursor: default; }

/* ═════════════════════════════════════════════════════════════════
   思考过程 (推理模型的 reasoning_content)
   刻意做得比正文"轻" —— 虚线框、灰字、小一号,它是过程不是结论
   ═════════════════════════════════════════════════════════════════ */
.think-block {
    margin: 6px 0 8px;
    border: 1px dashed var(--border);
    border-radius: 8px;
    background: #fafafa;
    overflow: hidden;
}
.think-head {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 7px 10px;
    cursor: pointer;
    font-size: 12px;
    color: var(--text-muted);
    user-select: none;
}
.think-head:hover { background: var(--border-light); }
.think-head .th-title { flex: 1 1 auto; }
.think-head .th-hint { font-size: 10px; opacity: 0.55; }
.think-body {
    display: none;
    padding: 8px 12px 10px;
    border-top: 1px dashed var(--border);
    font-size: 12px;
    line-height: 1.7;
    color: var(--text-muted);
    white-space: pre-wrap;
    word-break: break-word;
    max-height: 320px;
    overflow-y: auto;
}
.think-block.expanded .think-body { display: block; }
.think-block.live .th-icon { animation: think-pulse 1.3s ease-in-out infinite; }
@keyframes think-pulse {
    0%, 100% { opacity: 0.35; }
    50%      { opacity: 1; }
}
.msg.user .msg-content {
    background: var(--user-bubble);
    border-bottom-right-radius: 6px;
}
.msg.assistant .msg-content {
    background: var(--assistant-bubble);
    border-bottom-left-radius: 6px;
}
.msg.system .msg-content {
    background: transparent;
    color: var(--text-faint);
    font-size: 12px;
    text-align: center;
    padding: 4px 12px;
}

/* Markdown */
.msg-content p { margin: 0 0 8px 0; }
.msg-content p:last-child { margin-bottom: 0; }
.msg-content h1, .msg-content h2, .msg-content h3,
.msg-content h4, .msg-content h5, .msg-content h6 {
    margin: 12px 0 6px 0;
    font-weight: 600;
    line-height: 1.4;
}
.msg-content h1 { font-size: 1.4em; }
.msg-content h2 { font-size: 1.25em; }
.msg-content h3 { font-size: 1.1em; }
.msg-content ul, .msg-content ol { margin: 6px 0 8px 22px; }
.msg-content li { margin: 2px 0; }
.msg-content code {
    background: rgba(0, 0, 0, 0.06);
    padding: 1px 5px;
    border-radius: 4px;
    font-family: Consolas, "Cascadia Code", "SF Mono", monospace;
    font-size: 0.9em;
}
.msg-content pre {
    background: var(--code-bg);
    border: 1px solid var(--border);
    padding: 10px 12px;
    border-radius: 8px;
    overflow-x: auto;
    margin: 6px 0 8px 0;
}
.msg-content pre code {
    background: none;
    padding: 0;
    font-size: 0.85em;
    line-height: 1.5;
    white-space: pre;
}

/* 代码块容器 + 顶部复制条 */
.msg-content .code-block {
    margin: 6px 0 8px 0;
    border: 1px solid var(--border);
    border-radius: 8px;
    overflow: hidden;
    background: var(--code-bg);
}
.msg-content .code-block pre {
    margin: 0;
    border: none;
    border-radius: 0;
}
.code-block-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 4px 10px;
    background: rgba(0, 0, 0, 0.35);
    border-bottom: 1px solid rgba(255, 255, 255, 0.08);
}
.code-block-lang {
    font-size: 11px;
    color: var(--text-muted);
    letter-spacing: 0.3px;
}
.code-copy-btn {
    background: none;
    border: 1px solid var(--border);
    border-radius: 5px;
    color: var(--text-muted);
    font-size: 11px;
    padding: 1px 10px;
    cursor: pointer;
    line-height: 1.6;
}
.code-copy-btn:hover { border-color: var(--primary); color: var(--primary); }
.msg-content a { color: var(--primary); text-decoration: none; }
.msg-content a:hover { text-decoration: underline; }
.msg-content strong { font-weight: 600; }
.msg-content em { font-style: italic; }

/* Markdown 表格 */
.msg-content .md-table-wrap {
    overflow-x: auto;
    margin: 8px 0;
    max-width: 100%;
}
.msg-content table.md-table {
    border-collapse: collapse;
    font-size: 12px;
    line-height: 1.5;
    min-width: 100%;
}
.msg-content table.md-table th,
.msg-content table.md-table td {
    border: 1px solid var(--border);
    padding: 5px 10px;
    vertical-align: top;
    text-align: left;
    word-break: break-word;
}
.msg-content table.md-table th {
    background: #f9fafb;
    font-weight: 600;
    color: var(--text);
}
.msg-content table.md-table tr:nth-child(even) td {
    background: #fafbfc;
}
.msg-content table.md-table code {
    font-size: 11px;
    padding: 1px 4px;
}

/* 工具卡片 */
.tools-container { margin-top: 8px; display: flex; flex-direction: column; gap: 4px; }
.tool-block {
    border: 1px solid var(--border);
    border-radius: 6px;
    overflow: hidden;
    font-size: 12px;
    background: #fafafa;
}
.tool-head {
    padding: 4px 10px;
    display: flex;
    align-items: center;
    gap: 6px;
    cursor: pointer;
    user-select: none;
    min-height: 22px;
}
.tool-head:hover { background: var(--border-light); }
.tool-icon { color: var(--primary); font-weight: 600; }
.tool-name { font-weight: 500; color: var(--text); }
.tool-input {
    color: var(--text-muted);
    font-family: Consolas, monospace;
    font-size: 11px;
    margin-left: auto;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    max-width: 55%;
}
/* 折叠指示箭头: 折叠时 ▸, 展开时 ▾;给用户明确的"可点击"暗示 */
.tool-caret {
    color: var(--text-faint);
    font-size: 10px;
    width: 12px;
    text-align: center;
    flex: 0 0 auto;
    transition: transform 0.15s;
}
.tool-block:not(.collapsed) .tool-caret { transform: rotate(90deg); }
/* 完成后小 badge —— 成功/错误 */
.tool-status {
    font-size: 10px;
    padding: 1px 6px;
    border-radius: 3px;
    flex: 0 0 auto;
    display: none;
}
.tool-block.done .tool-status { display: inline-block; }
.tool-block.done.err .tool-status { background: #fee2e2; color: var(--danger); }
.tool-block.done:not(.err) .tool-status { background: #dcfce7; color: #059669; }

.tool-body {
    padding: 8px 10px;
    border-top: 1px solid var(--border);
    font-family: Consolas, monospace;
    font-size: 11px;
    line-height: 1.5;
    color: var(--text-muted);
    max-height: 240px;
    overflow-y: auto;
    background: #fff;
}
.tool-body-text {
    white-space: pre-wrap;
    word-break: break-word;
}
.tool-copy-btn {
    display: block;
    margin-bottom: 6px;
    background: none;
    border: 1px solid var(--border);
    border-radius: 5px;
    color: var(--text-muted);
    font-size: 11px;
    padding: 1px 10px;
    cursor: pointer;
    line-height: 1.6;
}
.tool-copy-btn:hover { border-color: var(--primary); color: var(--primary); }
.tool-body.err { color: var(--danger); background: #fef2f2; }
/* 强化优先级:collapsed 一律隐藏 body,不管 done 与否 */
.tool-block.collapsed > .tool-body { display: none !important; }
.tool-block:not(.done) .tool-icon { animation: spin 1.5s linear infinite; display: inline-block; }
@keyframes spin { to { transform: rotate(360deg); } }

/* 思考中: 三个点跳动 —— 用户消息发出到收到第一个 delta/toolCall 之间显示,避免以为界面卡了 */
.msg.thinking .msg-content {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    padding: 14px 18px;
    min-height: unset;
}
.msg.thinking .dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--text-muted);
    animation: dotbounce 1.4s infinite ease-in-out;
    opacity: 0.4;
}
.msg.thinking .dot:nth-child(2) { animation-delay: 0.2s; }
.msg.thinking .dot:nth-child(3) { animation-delay: 0.4s; }
@keyframes dotbounce {
    0%, 60%, 100% { opacity: 0.35; transform: translateY(0); }
    30% { opacity: 1; transform: translateY(-4px); }
}

/* ═════════════════════════════════════════════════════════════════
   输入区
   ═════════════════════════════════════════════════════════════════ */
#composer {
    flex: 0 0 auto;
    border-top: 1px solid var(--border);
    padding: 8px 8px 10px;
    background: var(--footer-bg);
}
/* 输入区做成一张卡片:附件、文本框、权限、上传、token、发送全部收在同一个边框里 */
#composer-card {
    border: 1px solid var(--border);
    border-radius: 14px;
    background: #fff;
    padding: 8px 10px;
    box-shadow: 0 1px 2px rgba(0, 0, 0, 0.04);
    transition: border-color 0.15s, box-shadow 0.15s;
}
#composer-card.focused {
    border-color: var(--primary);
    box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.12);
}
#attachments {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-bottom: 6px;
}
#attachments:empty { display: none; }

.att-card {
    display: flex;
    flex-direction: column;
    padding: 6px 10px;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: #f9fafb;
    font-size: 12px;
    max-width: 100%;
    min-width: 180px;
    flex: 1 1 220px;
    overflow: hidden;
    transition: border-color 0.15s;
}
.att-card.uploading { border-color: var(--warning); background: #fffbeb; }
.att-card.error { border-color: var(--danger); background: #fef2f2; }
.att-head {
    display: flex;
    align-items: center;
    gap: 6px;
    cursor: pointer;
    user-select: none;
}
.att-icon { font-size: 14px; }
.att-name {
    flex: 1 1 auto;
    font-weight: 500;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    min-width: 0;
}
.att-info {
    color: var(--text-muted);
    font-size: 11px;
    white-space: nowrap;
    flex: 0 0 auto;
}
.att-remove {
    border: none;
    background: none;
    cursor: pointer;
    color: var(--text-faint);
    padding: 0 4px;
    font-size: 14px;
    flex: 0 0 auto;
}
.att-remove:hover { color: var(--danger); }
.att-summary {
    margin-top: 6px;
    padding-top: 6px;
    border-top: 1px dashed var(--border);
    font-family: Consolas, monospace;
    font-size: 11px;
    color: var(--text-muted);
    white-space: pre-wrap;
    max-height: 120px;
    overflow-y: auto;
    display: none;
    line-height: 1.5;
}
.att-card.expanded .att-summary { display: block; }

/* 用户气泡里的附件卡片(restore 时由消息正文解析出来) */
.msg.user .att-list { display: flex; flex-direction: column; gap: 6px; margin-bottom: 8px; }
.msg.user .att-card {
    background: rgba(255, 255, 255, 0.72);
    border-color: rgba(0, 0, 0, 0.08);
    min-width: 0;
    flex: 0 0 auto;
}
.msg.user .att-summary { max-height: 220px; }
.msg.user .att-body { white-space: pre-wrap; word-break: break-word; }
.att-toggle-hint {
    font-size: 10px;
    color: var(--text-faint);
    margin-left: 4px;
    flex: 0 0 auto;
}

#input-box {
    width: 100%;
    box-sizing: border-box;
    border: none;
    outline: none;
    resize: none;
    background: transparent;
    padding: 4px 2px 2px;
    font-size: 13px;
    font-family: inherit;
    line-height: 1.55;
    color: var(--text);
    min-height: 26px;
    max-height: 180px;
    overflow-y: auto;
}
#input-box::placeholder { color: var(--text-faint); }
#input-box:disabled { background: transparent; cursor: not-allowed; }

/* 卡片底部工具条 */
#composer-bar {
    display: flex;
    align-items: center;
    gap: 6px;
    margin-top: 6px;
}
.cbar-spacer { flex: 1 1 auto; }

.cbar-btn {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    height: 28px;
    padding: 0 9px;
    border: 1px solid transparent;
    border-radius: 8px;
    background: transparent;
    color: var(--text-muted);
    font-size: 12px;
    font-family: inherit;
    cursor: pointer;
    white-space: nowrap;
    flex: 0 0 auto;
    transition: background 0.12s, color 0.12s, border-color 0.12s;
}
.cbar-btn:hover { background: var(--border-light); color: var(--text); }
.cbar-btn .caret { font-size: 9px; opacity: 0.5; }
.cbar-btn.icon-only {
    width: 28px;
    padding: 0;
    justify-content: center;
    font-size: 17px;
    line-height: 1;
}

/* 权限档位配色 —— 一眼看出当前风险等级 */
#perm-btn.mode-ask { color: var(--text-muted); }
#perm-btn.mode-auto_safe { color: #b45309; border-color: #fde68a; background: #fffbeb; }
#perm-btn.mode-auto_all { color: var(--danger); border-color: #fecaca; background: #fef2f2; }

/* 折叠态只剩一个环 —— 具体数字点开弹层看，按钮上不占位 */
#token-btn { width: 30px; padding: 0; justify-content: center; }

/* 折叠态用环形进度替代百分比数字:占位小,一眼看出余量,
   而具体数字点开弹层才需要 */
#token-ring { width: 16px; height: 16px; flex: 0 0 auto; }
/* 没有上下文数据时环整体变淡，而不是消失 —— 按钮位置保持稳定，不会左右跳 */
#token-ring.idle { opacity: 0.35; }
#token-ring circle { fill: none; stroke-width: 3; }
#token-ring .ring-bg { stroke: var(--border); }
#token-ring .ring-fg {
    stroke: var(--primary);
    stroke-linecap: round;
    transform: rotate(-90deg);
    transform-origin: 50% 50%;
    transition: stroke-dashoffset 0.3s ease, stroke 0.3s;
}
#token-ring.warn .ring-fg { stroke: #d97706; }
#token-ring.danger .ring-fg { stroke: var(--danger); }

.cbar-send {
    width: 32px;
    height: 32px;
    border-radius: 50%;
    border: none;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 15px;
    line-height: 1;
    flex: 0 0 auto;
    background: var(--primary);
    color: #fff;
    transition: background 0.12s, transform 0.1s;
}
/* 字符 ↑ 在多数中文字体里笔画很细，改用 SVG 描边，粗细可控 */
.cbar-send svg { display: block; }
.cbar-send:active { transform: scale(0.94); }
.cbar-send:hover { background: var(--primary-dark); }
.cbar-send:disabled { background: #cbd5e1; cursor: not-allowed; }
.cbar-send.stop { background: var(--danger); display: none; font-size: 11px; }
.cbar-send.stop:hover { background: #dc2626; }

/* 权限菜单锚在输入卡片左下 */
#perm-menu {
    top: auto;
    right: auto;
    bottom: 62px;
    left: 18px;
    min-width: 240px;
}
#perm-menu .menu-item { align-items: flex-start; }
#perm-menu .menu-item.active { background: #eff6ff; }
#perm-menu .pm-text { display: flex; flex-direction: column; gap: 2px; }
#perm-menu .pm-title { font-size: 12px; color: var(--text); }
#perm-menu .pm-desc { font-size: 11px; color: var(--text-faint); line-height: 1.45; }
#perm-menu .pm-check { margin-left: auto; color: var(--primary); font-size: 12px; visibility: hidden; }
#perm-menu .menu-item.active .pm-check { visibility: visible; }

/* ═════════════════════════════════════════════════════════════════
   上下文用量弹层
   ═════════════════════════════════════════════════════════════════ */
#token-pop {
    position: absolute;
    right: 16px;
    bottom: 62px;
    width: 304px;
    background: #fff;
    border: 1px solid var(--border);
    border-radius: 12px;
    box-shadow: 0 8px 28px rgba(0, 0, 0, 0.14);
    padding: 14px 16px 12px;
    z-index: 2600;
    display: none;
    animation: menu-in 0.12s ease-out;
}
#token-pop.show { display: block; }
.tp-head { display: flex; align-items: center; margin-bottom: 10px; }
.tp-head h4 { flex: 1 1 auto; margin: 0; font-size: 13px; font-weight: 600; color: var(--text); }
.tp-close {
    border: none; background: none; cursor: pointer;
    color: var(--text-faint); font-size: 16px; line-height: 1; padding: 0 2px;
}
.tp-close:hover { color: var(--text); }
.tp-main { display: flex; align-items: baseline; gap: 8px; margin-bottom: 9px; }
.tp-pct { font-size: 24px; font-weight: 700; color: var(--text); line-height: 1.1; }
.tp-used { font-size: 11px; color: var(--text-muted); }
.tp-bar {
    display: flex;
    height: 7px;
    border-radius: 4px;
    overflow: hidden;
    background: var(--border-light);
    margin-bottom: 12px;
}
.tp-bar i { display: block; height: 100%; }
.tp-row { display: flex; align-items: center; gap: 8px; font-size: 12px; padding: 3.5px 0; }
.tp-dot { width: 8px; height: 8px; border-radius: 50%; flex: 0 0 auto; }
.tp-label { flex: 1 1 auto; color: var(--text); }
.tp-val { color: var(--text-muted); font-family: Consolas, monospace; font-size: 11.5px; }
.tp-foot {
    margin-top: 10px;
    padding-top: 9px;
    border-top: 1px solid var(--border);
    font-size: 11px;
    color: var(--text-faint);
    line-height: 1.65;
}

/* ═════════════════════════════════════════════════════════════════
   状态栏
   ═════════════════════════════════════════════════════════════════ */
#status-bar {
    flex: 0 0 auto;
    height: 22px;
    padding: 0 12px;
    border-top: 1px solid var(--border);
    background: #fafafa;
    font-size: 11px;
    color: var(--text-muted);
    display: flex;
    align-items: center;
    gap: 8px;
}
#status-text {
    flex: 1 1 auto;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
}


/* 可点击的文件路径 */
.file-link {
    color: var(--primary);
    cursor: pointer;
    border-bottom: 1px dashed rgba(59, 130, 246, 0.45);
    word-break: break-all;
}
.file-link:hover {
    background: rgba(59, 130, 246, 0.08);
    border-bottom-style: solid;
}
.file-link::after {
    content: "↗";
    font-size: 0.8em;
    opacity: 0.55;
    margin-left: 2px;
}

/* ═════════════════════════════════════════════════════════════════
   Drop overlay
   ═════════════════════════════════════════════════════════════════ */
#drop-overlay {
    position: fixed;
    inset: 0;
    background: rgba(59, 130, 246, 0.1);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 1000;
    pointer-events: none;
}
#drop-overlay.show { display: flex; }
#drop-overlay .msg-box {
    background: #fff;
    border: 3px dashed var(--primary);
    padding: 24px 40px;
    border-radius: 16px;
    font-size: 15px;
    color: var(--primary);
    font-weight: 500;
    box-shadow: 0 4px 20px rgba(0, 0, 0, 0.15);
}

/* ═════════════════════════════════════════════════════════════════
   Modal (API Key)
   ═════════════════════════════════════════════════════════════════ */
.modal-mask {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.35);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 2000;
}
.modal-mask.show { display: flex; }
.modal {
    background: #fff;
    border-radius: 12px;
    padding: 20px;
    min-width: 360px;
    max-width: 520px;
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.2);
}
.modal h3 { margin-bottom: 8px; font-size: 15px; }
.modal p { color: var(--text-muted); font-size: 12px; margin-bottom: 12px; line-height: 1.6; }
.modal input[type=text], .modal input[type=password] {
    width: 100%;
    padding: 8px 10px;
    border: 1px solid var(--border);
    border-radius: 6px;
    font-size: 13px;
    margin-bottom: 10px;
    outline: none;
    font-family: Consolas, monospace;
}
.modal input:focus { border-color: var(--primary); }
.modal .row {
    display: flex;
    gap: 8px;
    justify-content: flex-end;
    margin-top: 12px;
}
.modal button {
    padding: 6px 14px;
    border: 1px solid var(--border);
    background: #fff;
    border-radius: 6px;
    cursor: pointer;
    font-size: 12px;
    color: var(--text);
}
.modal button:hover { background: var(--border-light); }
.modal button.primary {
    background: var(--primary);
    color: #fff;
    border-color: var(--primary);
}
.modal button.primary:hover { background: var(--primary-dark); }
.modal .show-toggle {
    font-size: 11px;
    color: var(--text-muted);
    user-select: none;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 4px;
}

/* 工具面板 modal */
/* 可用工具面板 —— 侧滑 drawer,跟历史对话样式一致 */
#tools-drawer-mask {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.0);
    display: none !important;
    z-index: 1500;
}
#tools-drawer-mask.show { display: block; }
#tools-drawer {
    position: fixed;
    top: 0;
    right: 0;
    height: 100%;
    width: 420px;
    max-width: 92vw;
    background: #fff;
    box-shadow: none;
    transform: translateX(100%);

    display: flex;
    flex-direction: column;
}
#tools-drawer.show { transform: translateX(0); }
#tools-drawer .tm-count { font-size: 12px; color: var(--text-muted); font-weight: 400; margin-left: 4px; }
#tools-drawer .tm-filter {
    margin: 10px 16px 4px;
    padding: 6px 10px;
    border: 1px solid var(--border);
    border-radius: 6px;
    font-size: 12px;
    outline: none;
    display: block;

    font-family: inherit;
}
#tools-drawer .tm-filter:focus { border-color: var(--primary); }
#tools-drawer .tm-list {
    flex: 1 1 auto;
    overflow-y: auto;
    padding: 6px 16px 14px;
}
.tool-item {
    padding: 10px 12px;
    margin: 0 -12px;
    border-bottom: 1px solid var(--border-light);
    cursor: pointer;
    border-radius: 6px;
    transition: background 0.12s;
    position: relative;
}
.tool-item:hover {
    background: var(--border-light);
}
.tool-item:hover .tool-item-cta {
    opacity: 1;
    transform: translateX(0);
}
.tool-item:last-child { border-bottom: none; }
.tool-item-head {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 3px;
}
.tool-item-name {

    font-size: 12.5px;
    font-weight: 600;
    color: var(--primary);
}
.tool-item-badge {
    font-size: 10px;
    padding: 1px 6px;
    border-radius: 4px;
    background: var(--border-light);
    color: var(--text-muted);
}
.tool-item-badge.readonly { background: #ecfdf5; color: #047857; }
.tool-item-badge.mutating { background: #fef3c7; color: #b45309; }
/* hover 时右上角出现的"填入输入框"暗示 */
.tool-item-cta {
    margin-left: auto;
    font-size: 11px;
    color: var(--primary);
    opacity: 0;
    transform: translateX(-4px);
    transition: opacity 0.15s, transform 0.15s;

}
.tool-item-desc {

    color: var(--text-muted);

}
#tools-drawer .tm-empty {
    padding: 24px;

    color: var(--text-faint);

}

.approval-modal .ap-head-icon { font-size: 18px; }

}
.approval-modal .ap-generic-label {

/* 模型/工具设置 modal */
.modal.settings-modal {

.settings-modal .sm-head {

}
.settings-modal .sm-head h3 { flex: 1 1 auto; font-size: 14px; margin: 0; }

}
.settings-modal .sm-body { flex: 1 1 auto; overflow-y: auto; padding: 12px 16px; }
.settings-modal .sm-section { margin-bottom: 18px; }
.settings-modal .sm-section h4 {

}
.settings-modal .sm-hint { font-size: 11px; color: var(--text-faint); font-weight: 400; }

.sm-provider-row:hover { background: var(--border-light, #f3f4f6); }
.sm-provider-row .sm-pv-name { font-weight: 600; }
.sm-provider-row .sm-pv-meta { color: var(--text-muted); font-size: 11px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sm-provider-row .sm-pv-del {

/* 审批 modal 遮罩不允许点击穿透关闭 —— 用户必须显式点允许/拒绝 */
.modal-mask.no-mask-close { }

/* ═════════════════════════════════════════════════════════════════
   ask_user modal (AI 主动提问)
   confirm: 显示 是/否 两按钮
   choice:  显示每个 option 一个按钮
   input:   显示文本框 + 提交
   ═════════════════════════════════════════════════════════════════ */
.modal.askuser-modal {
    width: 460px;
    max-width: 92vw;
    padding: 0;
}
.askuser-modal .au-head {
    padding: 12px 20px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 10px;
}
.askuser-modal .au-head-icon { font-size: 18px; }
.askuser-modal .au-head h3 { flex: 1 1 auto; font-size: 14px; margin: 0; }
.askuser-modal .au-body {
    padding: 18px 20px;
    max-height: 55vh;
    overflow-y: auto;
}
.askuser-modal .au-question {
    font-size: 13px;
    line-height: 1.6;
    color: var(--text);
    margin-bottom: 14px;
    white-space: pre-wrap;
    word-break: break-word;
}
.askuser-modal .au-choices {
    display: flex;
    flex-direction: column;
    gap: 6px;
}
.askuser-modal .au-choices button {
    padding: 8px 12px;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: #fff;
    color: var(--text);
    cursor: pointer;
    font-size: 12.5px;
    font-family: inherit;
    text-align: left;
    transition: background 0.12s, border-color 0.12s;
}
.askuser-modal .au-choices button:hover {
    background: var(--border-light);
    border-color: var(--primary);
}
.askuser-modal .au-choices button.primary {
    background: var(--primary);
    color: #fff;
    border-color: var(--primary);
}
.askuser-modal .au-choices button.primary:hover { background: var(--primary-dark); }
.askuser-modal .au-input {
    width: 100%;
    padding: 8px 10px;
    border: 1px solid var(--border);
    border-radius: 6px;
    font-size: 13px;
    font-family: inherit;
    outline: none;
    box-sizing: border-box;
}
.askuser-modal .au-input:focus { border-color: var(--primary); }
.askuser-modal .au-foot {
    padding: 10px 20px 14px;
    border-top: 1px solid var(--border);
    display: flex;
    justify-content: flex-end;
    gap: 8px;
}
.askuser-modal .au-foot button {
    padding: 6px 16px;
    border: 1px solid var(--border);
    border-radius: 6px;
    cursor: pointer;
    font-size: 12px;
    font-family: inherit;
}
.askuser-modal .au-cancel { background: #fff; color: var(--text-muted); }
.askuser-modal .au-cancel:hover { background: var(--border-light); }
.askuser-modal .au-submit {
    background: var(--primary);
    color: #fff;
    border-color: var(--primary);
}
.askuser-modal .au-submit:hover { background: var(--primary-dark); }

/* 字段化渲染:multi_choice / 带自定义的 choice / form 混合表单共用同一套外观,
   避免多选长得跟单选不是一套控件 */
.askuser-modal .au-form { display: flex; flex-direction: column; gap: 16px; }
.askuser-modal .au-field { display: flex; flex-direction: column; gap: 7px; }
.askuser-modal .au-field-label {
    font-size: 12.5px;
    font-weight: 600;
    color: var(--text);
}
.askuser-modal .au-opts { display: flex; flex-direction: column; gap: 2px; }
.askuser-modal .au-opt {
    display: flex;
    align-items: flex-start;
    gap: 9px;
    padding: 6px 8px;
    border: 1px solid transparent;
    border-radius: 6px;
    cursor: pointer;
    font-size: 12.5px;
    line-height: 1.55;
    color: var(--text);
    transition: background 0.12s;
}
.askuser-modal .au-opt:hover { background: var(--border-light); }
.askuser-modal .au-opt input { margin: 3px 0 0 0; flex: 0 0 auto; cursor: pointer; }
.askuser-modal .au-opt span { flex: 1 1 auto; word-break: break-word; }
.askuser-modal .au-bulk { display: flex; gap: 14px; padding: 2px 8px; }
.askuser-modal .au-bulk a {
    font-size: 11.5px;
    color: var(--primary);
    cursor: pointer;
    text-decoration: none;
}
.askuser-modal .au-bulk a:hover { text-decoration: underline; }
.askuser-modal .au-field .au-input { width: 100%; }
.askuser-modal textarea.au-input {
    min-height: 92px;
    resize: vertical;
    line-height: 1.6;
}
.askuser-modal .au-custom { margin-left: 26px; margin-top: 2px; }
.askuser-modal select.au-input {
    appearance: auto;
    background: #fff;
    cursor: pointer;
}

/* ═════════════════════════════════════════════════════════════════
   历史对话抽屉
   ═════════════════════════════════════════════════════════════════ */
#drawer-mask {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.25);
    display: none;
    z-index: 1500;
}
#drawer-mask.show { display: block; }
#drawer {
    position: fixed;
    top: 0;
    right: 0;
    height: 100%;
    width: 340px;
    background: #fff;
    box-shadow: none !important;
    transform: translateX(100%);
    transition: transform 0.22s ease;
    z-index: 1600;
    display: flex;
    flex-direction: column;
}
#drawer.show { transform: translateX(0); }
.drawer-head {
    padding: 12px 16px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 8px;
}
.drawer-head h3 { flex: 1 1 auto; font-size: 14px; }
.drawer-head button {
    border: none;
    background: none;
    font-size: 16px;
    cursor: pointer;
    color: var(--text-muted);

.drawer-head button:hover { color: var(--text); }
.drawer-body {
    flex: 1 1 auto;
    overflow-y: auto;

}
.conv-item {
    padding: 10px 16px;
    border-bottom: 1px solid var(--border-light);
    cursor: pointer;

<script>
"use strict";

// ═════════════════════════════════════════════════════════════════
//  全局状态
// ═════════════════════════════════════════════════════════════════
const state = {
    ready: false,
    keyReady: false,
    busy: false,
    attachments: [],              // 已上传成功待发送: [{id, name}]
    approvalMode: "ask",          // 当前权限档位
    tokens: {},                   // 最近一次 tokenUsage 负载
    currentThinkBlock: null,      // 本轮思考块 DOM
    currentThinkBody: null,
    currentThinkBuffer: "",
    pendingUploads: 0,            // 正在上传的文件数
    currentAssistantMsg: null,    // 当前流式渲染中的 assistant 消息 DOM
    currentAssistantContent: null,// 上面消息的 .msg-content
    currentAssistantBuffer: "",   // 累积的原始文本
    lastAssistantMsg: null,       // 最近一条 assistant 消息 (用于挂 toolCall)
    isComposing: false,           // IME 组词中
    providers: [],                // v2: 所有 provider 元数据 [{id,displayName,baseUrl,models,isLocal,keyPageUrl}]
    currentProviderId: "deepseek",// v2: 当前选中的 provider id (从 modelList 或 askApiKey 更新)
    keyModalProviderId: null,     // v2: Key modal 正在设置哪个 provider 的 key
};

// ═════════════════════════════════════════════════════════════════
//  C# 通信
// ═════════════════════════════════════════════════════════════════
function postToHost(msg) {
    try {
        window.chrome.webview.postMessage(JSON.stringify(msg));
    } catch (e) {
        console.error("postMessage failed:", e);
    }
}

// C# 调用入口 (统一为 dispatchMessage(jsonString),与 form 侧 PostJs 保持一致)
window.dispatchMessage = function (json) {
    let msg;
    try { msg = typeof json === "string" ? JSON.parse(json) : json; }
    catch (e) { console.error("dispatchMessage parse:", e); return; }

    switch (msg.type) {
        case "modelList":
            onModelList(msg.items, msg.current, msg.providers, msg.currentProvider);
            if (document.getElementById("settings-modal").classList.contains("show"))
                onProviders(msg.providers);
            break;
        case "keyReady":       onKeyReady(); break;
        case "askApiKey":      onAskApiKey(msg.reason); break;
        case "convList":       onConvList(msg.items); break;
        case "clear":          onClear(); break;
        case "restore":        onRestore(msg.messages); break;
        case "message":        onMessage(msg.role, msg.text); break;
        case "delta":          onDelta(msg.text); break;
        case "closeAssistant": onCloseAssistant(); break;
        case "reasoningStart": onReasoningStart(); break;
        case "reasoningDelta": onReasoningDelta(msg.text); break;
        case "reasoningEnd":   onReasoningEnd(); break;
        case "toolCall":       onToolCall(msg.name, msg.input); break;
        case "toolResult":     onToolResult(msg.name, msg.result, msg.isErr); break;
        case "status":         onStatus(msg.text); break;
        case "userTextPrefill": onUserTextPrefill(msg.text); break;
        case "busy":           onBusy(msg.value); break;
        case "tokenUsage":     onTokenUsage(msg); break;
        case "attachmentInfo": onAttachmentInfo(msg); break;
        case "toolList":       onToolList(msg.items); break;
        case "askApproval":    onAskApproval(msg); break;
        case "askUser":        onAskUser(msg); break;
        case "approvalMode":
            if (msg.value) setPermMode(msg.value, false);
            break;
        case "toolGroups":
            onToolGroups(msg.groups);
            break;
        case "restoreInput":
            onRestoreInput(msg.text, msg.attachments);
            break;
    }
};

// ═════════════════════════════════════════════════════════════════
//  顶栏事件
// ═════════════════════════════════════════════════════════════════
document.getElementById("model-select").addEventListener("change", (e) => {
    const opt = e.target.selectedOptions[0];
    if (!opt) return;

    // 【必须把 providerId 一起发过去】只发模型名的话，C# 侧遇到
    // "deepseek-v4-flash" 这种跨 provider 同名模型只能猜，必然串。
    const providerId = opt.dataset.providerId || state.currentProviderId;
    const model = opt.dataset.model || opt.value;

    state.currentProviderId = providerId;
    refreshModelPicker();
    closeModelPicker(true);
    postToHost({ type: "switchModel", model: model, providerId: providerId });
});
initModelPicker();
// ═════════════════════════════════════════════════════════════════
//  权限档位 (原顶栏下拉,现为输入卡片内的按钮 + 菜单)
// ═════════════════════════════════════════════════════════════════
const PERM_MODES = {
    ask:       { icon: "\u{1F6E1}", label: "\u8be2\u95ee",   desc: "\u6bcf\u6b21\u53d8\u66f4\u573a\u666f\u524d\u5f39\u7a97\u786e\u8ba4" },
    auto_safe: { icon: "\u26a1",     label: "\u534a\u81ea\u52a8", desc: "\u4ee3\u7801\u4ecd\u5f39\u5ba1\u9605\u6846\uff0c\u5176\u4f59\u53d8\u66f4\u81ea\u52a8\u901a\u8fc7" },
    auto_all:  { icon: "\u26a0",     label: "\u5168\u81ea\u52a8", desc: "\u5168\u90e8\u81ea\u52a8\u6267\u884c\uff0c\u542b\u4ee3\u7801" }
};

function setPermMode(mode, notifyHost) {
    if (!PERM_MODES[mode]) mode = "ask";
    state.approvalMode = mode;

    const btn = document.getElementById("perm-btn");
    btn.className = "cbar-btn mode-" + mode;
    btn.title = PERM_MODES[mode].desc;
    document.getElementById("perm-icon").textContent = PERM_MODES[mode].icon;
    document.getElementById("perm-label").textContent = PERM_MODES[mode].label;

    const items = document.querySelectorAll("#perm-menu .menu-item");
    for (let i = 0; i < items.length; i++) {
        items[i].classList.toggle("active", items[i].dataset.mode === mode);
    }

    if (notifyHost) postToHost({ type: "setApprovalMode", mode: mode });
}

document.getElementById("perm-btn").addEventListener("click", (e) => {
    e.stopPropagation();
    document.getElementById("perm-menu").classList.toggle("show");
});

document.querySelectorAll("#perm-menu .menu-item").forEach((item) => {
    item.addEventListener("click", () => {
        const mode = item.dataset.mode;
        document.getElementById("perm-menu").classList.remove("show");

        if (mode === "auto_all" && state.approvalMode !== "auto_all") {
            const ok = confirm(
                "\u786e\u8ba4\u5207\u6362\u5230\u300c\u5168\u81ea\u52a8\u300d\u5ba1\u6279\u6a21\u5f0f?\n\n" +
                "\u6b64\u6a21\u5f0f\u4e0b AI \u751f\u6210\u7684 C# \u4ee3\u7801(run_csharp)\u5c06\u76f4\u63a5\u6267\u884c,\u4e0d\u518d\u5f39\u51fa\u4ee3\u7801\u5ba1\u9605\u6846\u3002\n" +
                "AI \u53ef\u80fd\u521b\u5efa/\u4fee\u6539/\u5220\u9664\u573a\u666f\u5bf9\u8c61,\u5efa\u8bae\u4ec5\u5728\u9a8c\u8bc1\u8fc7\u7684\u4f1a\u8bdd\u4e2d\u4f7f\u7528\u3002\n\n" +
                "\u786e\u8ba4\u7ee7\u7eed?"
            );
            if (!ok) return;
        }
        setPermMode(mode, true);
    });
});

// ═════════════════════════════════════════════════════════════════
//  上下文用量弹层
// ═════════════════════════════════════════════════════════════════
const TP_PARTS = [
    { key: "system",   label: "\u7cfb\u7edf\u63d0\u793a\u8bcd", color: "#10b981" },
    { key: "tools",    label: "\u5de5\u5177\u5b9a\u4e49",       color: "#f59e0b" },
    { key: "messages", label: "\u5bf9\u8bdd\u6d88\u606f",       color: "#7c3aed" },
    { key: "other",    label: "\u5176\u5b83",                     color: "#38bdf8" }
];

document.getElementById("token-btn").addEventListener("click", (e) => {
    e.stopPropagation();
    const pop = document.getElementById("token-pop");
    const show = !pop.classList.contains("show");
    pop.classList.toggle("show", show);
    if (show) renderTokenPop();
});
document.getElementById("tp-close").addEventListener("click", () => {
    document.getElementById("token-pop").classList.remove("show");
});

function renderTokenPop() {
    const d = state.tokens || {};
    const bar = document.getElementById("tp-bar");
    const list = document.getElementById("tp-list");
    bar.innerHTML = "";
    list.innerHTML = "";

    const max = d.ctxMax || 0;
    const used = d.ctxUsed || 0;

    if (max > 0) {
        const pct = used / max * 100;
        document.getElementById("tp-pct").textContent = pct.toFixed(1) + "%";
        document.getElementById("tp-used").textContent =
            "\u5df2\u4f7f\u7528 " + fmtNum(used) + " / " + fmtNum(max);
    } else {
        document.getElementById("tp-pct").textContent = "\u2014";
        document.getElementById("tp-used").textContent = "\u5c1a\u65e0\u4e0a\u4e0b\u6587\u6570\u636e";
    }

    const parts = d.parts || {};
    let shown = 0;

    for (let i = 0; i < TP_PARTS.length; i++) {
        const p = TP_PARTS[i];
        const v = parts[p.key] || 0;
        if (v <= 0) continue;
        shown += v;

        if (max > 0) {
            const seg = document.createElement("i");
            seg.style.width = (v / max * 100) + "%";
            seg.style.background = p.color;
            bar.appendChild(seg);
        }

        const row = document.createElement("div");
        row.className = "tp-row";
        const dot = document.createElement("span");
        dot.className = "tp-dot";
        dot.style.background = p.color;
        const lab = document.createElement("span");
        lab.className = "tp-label";
        lab.textContent = p.label;
        const val = document.createElement("span");
        val.className = "tp-val";
        val.textContent = max > 0
            ? (v / max * 100).toFixed(1) + "%  \u00b7  " + fmtNum(v)
            : fmtNum(v);
        row.appendChild(dot);
        row.appendChild(lab);
        row.appendChild(val);
        list.appendChild(row);
    }

    if (shown === 0) {
        const row = document.createElement("div");
        row.className = "tp-row";
        row.innerHTML = "<span class='tp-label' style='color:var(--text-faint)'>" +
            "\u5bbf\u4e3b\u672a\u4e0b\u53d1\u5206\u9879\u6570\u636e</span>";
        list.appendChild(row);
    }

    document.getElementById("tp-foot").textContent =
        "\u672c\u4f1a\u8bdd\u7d2f\u8ba1(\u542b\u5386\u53f2)\uff1a\u8f93\u5165 " + fmtNum(d.prompt || 0) +
        " \u00b7 \u8f93\u51fa " + fmtNum(d.completion || 0) +
        " \u00b7 \u5408\u8ba1 " + fmtNum(d.total || 0) +
        (max > 0 ? "\n\u5206\u9879\u4e3a\u4f30\u7b97\u503c\uff0c\u4ec5\u4f9b\u53c2\u8003" : "");
    document.getElementById("tp-foot").style.whiteSpace = "pre-line";
}

document.getElementById("btn-new").addEventListener("click", () => {
    postToHost({ type: "newConv" });
    clearAllAttachments();
});

// ⋯ 更多菜单
document.getElementById("btn-more").addEventListener("click", (e) => {
    e.stopPropagation();
    document.getElementById("more-menu").classList.toggle("show");
});
document.addEventListener("click", (e) => {
    const menu = document.getElementById("more-menu");
    if (!menu.classList.contains("show")) return;
    if (e.target.id === "btn-more") return;
    if (menu.contains(e.target)) return;
    menu.classList.remove("show");
});

// 点击别处关掉权限菜单 / 用量弹层
document.addEventListener("click", (e) => {
    const pm = document.getElementById("perm-menu");
    if (pm.classList.contains("show") && !pm.contains(e.target) && e.target.id !== "perm-btn") {
        pm.classList.remove("show");
    }
    const tp = document.getElementById("token-pop");
    if (tp.classList.contains("show") && !tp.contains(e.target) && e.target.id !== "token-btn") {
        tp.classList.remove("show");
    }
});
document.addEventListener("keydown", (e) => {
    if (e.key === "Escape") {
        document.getElementById("more-menu").classList.remove("show");
    }
});
document.querySelectorAll("#more-menu .menu-item").forEach((item) => {
    item.addEventListener("click", () => {
        document.getElementById("more-menu").classList.remove("show");
        handleMenuAction(item.dataset.action);
    });
});

function handleMenuAction(action) {
    switch (action) {
        case "history":
            postToHost({ type: "listConvs" });
            showDrawer();
            break;
        case "tools":
            openToolsModal();
            break;
        case "extract":
            postToHost({ type: "extractLessons" });
            break;
        case "key": {
            const pid = state.currentProviderId || "deepseek";
            const prov = (state.providers || []).find(p => p.id === pid);
            openKeyModal("\u91cd\u65b0\u8bbe\u7f6e API Key",
                pid,
                prov && prov.displayName,
                prov && prov.baseUrl,
                prov && prov.keyPageUrl,
                prov && prov.isLocal);
            break;
        }
        case "settings":
            openSettingsModal();
            break;
    }
}

function modelBrand(model, provider) {
    // 代理和本地服务也按模型家族显示品牌；供应商分组仍表达实际调用的接口。
    const name = String(model || '').toLowerCase();
    const families = [
        ['deepseek', /deepseek/], ['kimi', /kimi|moonshot/], ['qwen', /qwen|qwq/],
        ['openai', /(?:^|[/:])(?:gpt-|chatgpt|o[1-9](?:-|$)|codex)/],
        ['claude', /claude/], ['gemini', /gemini|gemma/], ['glm', /(?:chat)?glm/],
        ['grok', /grok/], ['minimax', /minimax/], ['doubao', /doubao/], ['llama', /llama/]
    ];
    for (const [brand, pattern] of families) if (pattern.test(name)) return brand;
    const id = provider && String(provider.id || '').toLowerCase();
    if (Object.prototype.hasOwnProperty.call(MODEL_LOGOS, id)) return id;
    return null;
}

function createModelLogo(model, provider) {
    const brand = modelBrand(model, provider);
    if (brand) {
        const image = document.createElement('img');
        image.className = 'model-logo';
        image.src = MODEL_LOGOS[brand];
        image.alt = '';
        image.setAttribute('aria-hidden', 'true');
        return image;
    }
    // 自定义、未知模型用中性图形，避免给它误标其他公司的品牌。
    const icon = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
    icon.setAttribute('class', 'model-logo');
    icon.setAttribute('viewBox', '0 0 24 24');
    icon.setAttribute('aria-hidden', 'true');
    const shape = document.createElementNS('http://www.w3.org/2000/svg', 'path');
    shape.setAttribute('d', 'M12 3 3 8v8l9 5 9-5V8L12 3ZM3 8l9 5 9-5M12 13v8');
    shape.setAttribute('fill', 'none');
    shape.setAttribute('stroke', 'currentColor');
    shape.setAttribute('stroke-width', '1.5');
    shape.setAttribute('stroke-linejoin', 'round');
    icon.appendChild(shape);
    return icon;
}

function closeModelPicker(focus) {
    const trigger = document.getElementById('model-trigger');
    const menu = document.getElementById('model-menu');
    menu.hidden = true;
    trigger.setAttribute('aria-expanded', 'false');
    if (focus && !trigger.disabled) trigger.focus();
}

function openModelPicker() {
    const trigger = document.getElementById('model-trigger');
    const menu = document.getElementById('model-menu');
    if (trigger.disabled) return;
    menu.hidden = false;
    trigger.setAttribute('aria-expanded', 'true');
    const rect = trigger.getBoundingClientRect();
    menu.style.left = Math.max(8, Math.min(rect.left, window.innerWidth - menu.offsetWidth - 8)) + 'px';
    menu.style.top = (rect.bottom + 6) + 'px';
    menu.style.maxHeight = Math.max(80, Math.min(420, window.innerHeight - rect.bottom - 14)) + 'px';
    const selected = menu.querySelector('[aria-selected="true"]') || menu.querySelector('.model-option');
    if (selected) selected.focus();
}

function refreshModelPicker() {
    const sel = document.getElementById('model-select');
    const trigger = document.getElementById('model-trigger');
    const menu = document.getElementById('model-menu');
    const selected = sel.selectedOptions[0];
    trigger.innerHTML = '';
    trigger.disabled = !selected;
    const providerFor = option => (state.providers || []).find(p => p.id === option.dataset.providerId);
    if (selected) trigger.appendChild(createModelLogo(selected.dataset.model || selected.value, providerFor(selected)));
    const label = document.createElement('span');
    label.className = 'model-label';
    label.textContent = selected ? selected.textContent : '暂无可用模型';
    trigger.appendChild(label);
    const chevron = document.createElement('span');
    chevron.className = 'model-chevron';
    chevron.textContent = '▾';
    chevron.setAttribute('aria-hidden', 'true');
    trigger.appendChild(chevron);
    const provider = selected && providerFor(selected);
    trigger.title = selected ? (provider ? provider.displayName + ' / ' : '') + label.textContent : label.textContent;
    trigger.setAttribute('aria-label', '选择模型：' + trigger.title);

    menu.innerHTML = '';
    let index = 0;
    function appendOption(option, parent) {
        const optionIndex = index++;
        const button = document.createElement('button');
        button.type = 'button';
        button.className = 'model-option';
        button.setAttribute('role', 'option');
        button.setAttribute('aria-selected', option.selected ? 'true' : 'false');
        button.tabIndex = -1;
        button.appendChild(createModelLogo(option.dataset.model || option.value, providerFor(option)));
        const text = document.createElement('span');
        text.className = 'model-label';
        text.textContent = option.textContent;
        button.appendChild(text);
        button.title = option.textContent;
        const check = document.createElement('span');
        check.className = 'model-check';
        check.textContent = option.selected ? '✓' : '';
        check.setAttribute('aria-hidden', 'true');
        button.appendChild(check);
        button.onclick = () => {
            sel.selectedIndex = optionIndex;
            sel.dispatchEvent(new Event('change', { bubbles: true }));
        };
        parent.appendChild(button);
    }
    for (const child of sel.children) {
        if (child.tagName === 'OPTGROUP') {
            const group = document.createElement('div');
            group.setAttribute('role', 'group');
            group.setAttribute('aria-label', child.label);
            const heading = document.createElement('div');
            heading.className = 'model-group-title';
            heading.textContent = child.label;
            group.appendChild(heading);
            for (const option of child.children) appendOption(option, group);
            menu.appendChild(group);
        } else appendOption(child, menu);
    }
}

function initModelPicker() {
    const picker = document.getElementById('model-picker');
    const trigger = document.getElementById('model-trigger');
    const menu = document.getElementById('model-menu');
    trigger.onclick = () => menu.hidden ? openModelPicker() : closeModelPicker(true);
    trigger.addEventListener('keydown', e => {
        if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
            e.preventDefault();
            openModelPicker();
        }
    });
    let search = '', searchAt = 0;
    menu.addEventListener('keydown', e => {
        if (e.key === 'Escape') { e.preventDefault(); closeModelPicker(true); return; }
        if (e.key === 'Tab') { closeModelPicker(true); return; }
        const options = Array.from(menu.querySelectorAll('.model-option'));
        if (!options.length) return;
        let index = options.indexOf(document.activeElement);
        if (e.key === 'ArrowDown') index = (index + 1) % options.length;
        else if (e.key === 'ArrowUp') index = (index - 1 + options.length) % options.length;
        else if (e.key === 'Home') index = 0;
        else if (e.key === 'End') index = options.length - 1;
        else if (e.key.length === 1 && !e.ctrlKey && !e.metaKey && !e.altKey && e.key !== ' ') {
            const now = Date.now();
            search = (now - searchAt > 600 ? '' : search) + e.key.toLowerCase();
            searchAt = now;
            index = options.findIndex(o => o.title.toLowerCase().startsWith(search));
        } else return;
        e.preventDefault();
        if (index >= 0) options[index].focus();
    });
    document.addEventListener('click', e => { if (!picker.contains(e.target)) closeModelPicker(false); });
    window.addEventListener('resize', () => closeModelPicker(false));
}

function onModelList(items, current, providers, currentProvider) {
    // v2 协议: 有 providers 参数 → 按 provider 分组显示;
    // 老协议(items+current) 兼容: 直接扁平列
    const sel = document.getElementById("model-select");
    sel.innerHTML = "";

    if (providers && providers.length > 0) {
        state.providers = providers;
        state.currentProviderId = currentProvider || providers[0].id;
        // 【option 的 value 必须带 provider】
        // 同一个模型名会同时出现在多个 provider 下(百炼代理了 deepseek/kimi)。
        // value 只写模型名的话:
        //   · 恢复选中时 "m === current" 会把两个同名项都标 selected，
        //     浏览器只保留最后一个 —— 于是永远落在最后那个 provider 上；
        //   · change 事件里 e.target.value 也分不出是哪个组点的。
        // 用 "provider|model" 复合键，两个问题一起消失。
        for (const p of providers) {
            const g = document.createElement("optgroup");
            g.label = p.displayName + (p.isLocal ? "  (\u672c\u5730)" : "");
            for (const m of (p.models || [])) {
                const opt = document.createElement("option");
                opt.value = p.id + "|" + m;
                opt.textContent = m;
                opt.dataset.providerId = p.id;
                opt.dataset.model = m;
                if (m === current && p.id === state.currentProviderId) opt.selected = true;
                g.appendChild(opt);
            }
            sel.appendChild(g);
        }

        // 上面按 provider+model 精确匹配没命中(比如首次启动、或 provider 变了)，
        // 退回只按模型名选第一个 —— 总比一个都不选好
        if (sel.selectedIndex < 0 && current) {
            for (const o of sel.options)
                if (o.dataset.model === current) { o.selected = true; break; }
        }
    } else if (items) {
        state.providers = [];
        for (const it of items) {
            const opt = document.createElement("option");
            opt.value = it;
            opt.textContent = it;
            if (it === current) opt.selected = true;
            sel.appendChild(opt);
        }
    }
    closeModelPicker(false);
    refreshModelPicker();
}

function onKeyReady() {
    state.keyReady = true;
    closeKeyModal();
    updateSendState();
}

function onAskApiKey(msgOrReason) {
    // 兼容两种调用: 直接传 reason 字符串,或传整个 msg 对象
    let reason, providerId, providerName, baseUrl, keyPageUrl, isLocal;
    if (typeof msgOrReason === "string") {
        reason = msgOrReason;
    } else {
        reason = msgOrReason.reason;
        providerId = msgOrReason.providerId;
        providerName = msgOrReason.providerName;
        baseUrl = msgOrReason.baseUrl;
        keyPageUrl = msgOrReason.keyPageUrl;
        isLocal = msgOrReason.isLocal;
    }
    openKeyModal(reason, providerId, providerName, baseUrl, keyPageUrl, isLocal);
}

function onClear() {
    document.getElementById("chat").innerHTML = "";
    state.currentAssistantMsg = null;
    state.currentAssistantContent = null;
    state.currentAssistantBuffer = "";
    state.lastAssistantMsg = null;
}

function onRestore(messages) {
    onClear();
    if (!messages) return;
    let bubble = null;  // 当前 assistant 大气泡 —— 遇 user 消息重置
    for (const m of messages) {
        if (m.role === "user") {
            appendMessage("user", m.text);
            bubble = null;
        } else if (m.role === "assistant") {
            // 思考属于该 assistant 段的前置内容，先创建气泡/思考块，再追加正文。
            if (!bubble) bubble = appendMessage("assistant", "");
            if (m.reasoning) {
                const block = createThinkBlock(m.reasoning, false);
                bubble.appendChild(block);
            }
            if (!bubble) {
                // 新一轮 —— 建大气泡,text 作为首段
                bubble = appendMessage("assistant", m.text);
            } else if (m.text) {
                // 同一轮内的后续 assistant 段 —— 在同一大气泡里追加一段 msg-content
                appendContentSegmentToMessage(bubble, m.text);
            }
            state.lastAssistantMsg = bubble;
            state.currentAssistantMsg = bubble;   // 便于后续 tool_result 匹配
            if (m.toolCalls) {
                for (const tc of m.toolCalls) {
                    const b = addToolCallToMessage(bubble, tc.name, tc.input);
                    b.dataset.tcId = tc.id || "";
                }
            }
        } else if (m.role === "tool") {
            // 挂结果到当前大气泡的对应 tool-block 上
            if (bubble) {
                addToolResultToMessage(bubble, m.name, m.result, m.isErr, m.toolCallId);
            }
        }
    }
    // 恢复完成,后续新一轮的 delta 会新建大气泡
    state.currentAssistantMsg = null;
    state.currentAssistantContent = null;
    state.currentAssistantBuffer = "";
    scrollToBottom();
}

function createThinkBlock(text, live) {
    const block = document.createElement("div");
    block.className = "think-block" + (live ? " expanded live" : "");
    const head = document.createElement("div"); head.className = "think-head";
    const icon = document.createElement("span"); icon.className = "th-icon"; icon.textContent = "💭";
    const title = document.createElement("span"); title.className = "th-title";
    title.textContent = live ? "思考中…" : "思考过程 (" + (text || "").length + " 字)";
    const hint = document.createElement("span"); hint.className = "th-hint"; hint.textContent = live ? "▾" : "▸";
    head.append(icon, title, hint);
    const body = document.createElement("div"); body.className = "think-body"; body.textContent = text || "";
    head.addEventListener("click", () => { const on = block.classList.toggle("expanded"); hint.textContent = on ? "▾" : "▸"; });
    block.append(head, body);
    return block;
}

/// 在已存在的 assistant 大气泡里追加一段新的 msg-content (文字段)
function appendContentSegmentToMessage(msgEl, text) {
    const seg = document.createElement("div");
    seg.className = "msg-content";
    seg.innerHTML = renderMarkdown(text);
    // 追加到 msg 里 —— 位置就在最末尾,天然按时序排(前面可能已经有其他 msg-content 或 tool-block)
    msgEl.appendChild(seg);
    return seg;
}

function onMessage(role, text) {
    onCloseAssistant();
    const uiRole = (role === "系统" || role === "system") ? "system"
                 : (role === "user") ? "user"
                 : "assistant";
    // user 消息 = 新一轮开始,强制关闭上一轮的 assistant 大气泡
    if (uiRole === "user") {
        state.currentAssistantMsg = null;
    }
    appendMessage(uiRole, text);
    scrollToBottom();
}

function onDelta(text) {
    hideThinking();
    onReasoningEnd();   // 正文开始即思考结束

    // 情况 1: 没有当前 assistant 大气泡 → 新建
    if (!state.currentAssistantMsg) {
        state.currentAssistantMsg = appendMessage("assistant", "");
        state.currentAssistantContent = state.currentAssistantMsg.querySelector(".msg-content");
        state.currentAssistantBuffer = "";
        state.lastAssistantMsg = state.currentAssistantMsg;
    }
    // 情况 2: 有大气泡但当前段被 onCloseAssistant 关掉了 (中间调过工具) → 在同一大气泡里追加新段
    else if (!state.currentAssistantContent) {
        const seg = document.createElement("div");
        seg.className = "msg-content";
        state.currentAssistantMsg.appendChild(seg);
        state.currentAssistantContent = seg;
        state.currentAssistantBuffer = "";
    }

    state.currentAssistantBuffer += text;
    if (state.currentAssistantContent.classList.contains("empty"))
        state.currentAssistantContent.classList.remove("empty");
    state.currentAssistantContent.innerHTML = renderMarkdownStreaming(state.currentAssistantBuffer);
    scrollToBottom();
}

// ═════════════════════════════════════════════════════════════════
//  思考过程
//
//  只有推理模型(DeepSeek reasoner 系列)会返回 reasoning_content,
//  普通模型这三个事件根本不会触发,不影响任何现有行为。
//
//  思考内容独立存档并可在历史中展开；API 是否回传由后端按 provider/model 决定。
//  历史思考默认折叠，避免占据阅读空间；不把它当作已验证结论。
// ═════════════════════════════════════════════════════════════════

function ensureAssistantBubble() {
    if (!state.currentAssistantMsg) {
        state.currentAssistantMsg = appendMessage("assistant", "");
        state.lastAssistantMsg = state.currentAssistantMsg;
    }
    return state.currentAssistantMsg;
}

function onReasoningStart() {
    hideThinking();
    if (state.currentThinkBlock) return;   // 已在思考中,不重复建块

    const msgEl = ensureAssistantBubble();

    const block = document.createElement("div");
    block.className = "think-block expanded live";

    const head = document.createElement("div");
    head.className = "think-head";

    const icon = document.createElement("span");
    icon.className = "th-icon";
    icon.textContent = "💭";

    const title = document.createElement("span");
    title.className = "th-title";
    title.textContent = "思考中…";

    const hint = document.createElement("span");
    hint.className = "th-hint";
    hint.textContent = "▾";

    head.appendChild(icon);
    head.appendChild(title);
    head.appendChild(hint);

    const body = document.createElement("div");
    body.className = "think-body";

    head.addEventListener("click", () => {
        const on = block.classList.toggle("expanded");
        hint.textContent = on ? "▾" : "▸";
    });

    block.appendChild(head);
    block.appendChild(body);
    // 按时序追加到大气泡末尾 —— 思考块会排在本轮正文之前
    msgEl.appendChild(block);

    state.currentThinkBlock = block;
    state.currentThinkBody = body;
    state.currentThinkBuffer = "";
    scrollToBottom();
}

function onReasoningDelta(text) {
    if (!text) return;
    if (!state.currentThinkBlock) onReasoningStart();

    state.currentThinkBuffer += text;
    state.currentThinkBody.textContent = state.currentThinkBuffer;

    // 思考区自己滚到底,不抢外层滚动
    state.currentThinkBody.scrollTop = state.currentThinkBody.scrollHeight;
    scrollToBottom();
}

function onReasoningEnd() {
    const block = state.currentThinkBlock;
    if (!block) return;

    block.classList.remove("live");

    // 思考结束自动收起 —— 它是过程,正文才是要看的
    block.classList.remove("expanded");

    const title = block.querySelector(".th-title");
    const hint = block.querySelector(".th-hint");
    const chars = state.currentThinkBuffer.length;
    if (title) title.textContent = "思考过程 (" + chars + " 字)";
    if (hint) hint.textContent = "▸";

    state.currentThinkBlock = null;
    state.currentThinkBody = null;
    state.currentThinkBuffer = "";
}

function onCloseAssistant() {
    // 只关闭"当前流式段落",大气泡保留 —— 下一段 delta/tool_call 会挂到同一气泡里,
    // 视觉上一整轮 assistant 回复共享一个"助手"标签 + 一个大气泡容器。
    onReasoningEnd();   // 兜底:一轮结束时思考块必须收尾,否则会一直闪
    state.currentAssistantContent = null;
    state.currentAssistantBuffer = "";
    // busy 仍在 → 空档期显示思考动画
    if (state.busy) showThinking();
}

function onToolCall(name, input) {
    hideThinking();
    // 确保大气泡存在 —— 有时 assistant 上来就调工具,没走过 onDelta
    if (!state.currentAssistantMsg) {
        state.currentAssistantMsg = appendMessage("assistant", "");
        state.lastAssistantMsg = state.currentAssistantMsg;
    }
    addToolCallToMessage(state.currentAssistantMsg, name, input);
    scrollToBottom();
}

function onToolResult(name, result, isErr) {
    if (state.currentAssistantMsg) {
        addToolResultToMessage(state.currentAssistantMsg, name, result, isErr, null);
    }
    if (state.busy) showThinking();
    scrollToBottom();
}

function onStatus(text) {
    document.getElementById("status-text").textContent = text || "";
}

// 预填输入框并聚焦(配方 promote 用:塞一句固化指令,用户确认后回车即发送)
function onUserTextPrefill(text) {
    const box = document.getElementById("input-box");
    if (box) {
        box.value = text || "";
        box.focus();
        box.dispatchEvent(new Event("input"));
    }
}

function onBusy(value) {
    state.busy = !!value;
    updateSendState();
    document.getElementById("stop-btn").style.display = value ? "flex" : "none";
    document.getElementById("send-btn").style.display = value ? "none" : "flex";
    if (value) {
        showThinking();
    } else {
        hideThinking();
        // 一轮彻底结束 —— 关闭大气泡,下一轮 delta 会新建一个
        state.currentAssistantMsg = null;
        state.currentAssistantContent = null;
        state.currentAssistantBuffer = "";
    }
}

// ═════════════════════════════════════════════════════════════════
//  思考中动画: 用户发送后到收到首个 delta/toolCall 之间显示三个跳点气泡
//  同时,在多轮 tool_call 之间的空档(工具刚返回、AI 还没输出下一段)也显示,
//  避免用户觉得界面卡了。
//
//  显示时机 (置于列表最底,总在最新一条内容之下):
//    - onBusy(true): 轮次开始
//    - onCloseAssistant + busy: 上一段 assistant 关闭但轮次未结束
//    - onToolResult + busy:     工具刚返回,AI 正在决定下一步
//  隐藏时机:
//    - onDelta:     新 delta 到达,内容显示了
//    - onToolCall:  工具卡片出现了
//    - onBusy(false): 轮次彻底结束
// ═════════════════════════════════════════════════════════════════
let _thinkingMsg = null;
function showThinking() {
    if (_thinkingMsg) {
        // 已存在 —— 移到列表最底(工具卡片之后)保证可见性
        document.getElementById("chat").appendChild(_thinkingMsg);
        scrollToBottom();
        return;
    }
    const msg = document.createElement("div");
    msg.className = "msg assistant thinking";
    msg.innerHTML =
        '<div class="msg-label">助手</div>' +
        '<div class="msg-content"><span class="dot"></span><span class="dot"></span><span class="dot"></span></div>';
    document.getElementById("chat").appendChild(msg);
    _thinkingMsg = msg;
    scrollToBottom();
}
function hideThinking() {
    if (_thinkingMsg) {
        _thinkingMsg.remove();
        _thinkingMsg = null;
    }
}

// ═════════════════════════════════════════════════════════════════
//  流式友好 markdown 渲染: 检测未闭合的 ``` 代码块并补一个尾闭合,
//  否则流式过程中大段文本会被误当代码 / 或者代码块渲染不出来,
//  restore 时看到的却是完整闭合,导致"流式和重开显示不一致"。
// ═════════════════════════════════════════════════════════════════
function renderMarkdownStreaming(text) {
    if (!text) return "";
    // 统计 ``` 出现次数,奇数 = 有一个未闭合的代码块
    const matches = text.match(/```/g);
    if (matches && (matches.length % 2 === 1)) {
        text = text + "\n```";
    }
    return renderMarkdown(text);
}

function onTokenUsage(msg) {
    state.tokens = msg || {};

    const ring = document.getElementById("token-ring");
    const fg = ring.querySelector(".ring-fg");
    const C = 2 * Math.PI * 8;   // r=8 的周长
    const total = msg.total || 0;

    if (msg.ctxMax > 0) {
        const pct = Math.max(0, Math.min(1, (msg.ctxUsed || 0) / msg.ctxMax));
        fg.setAttribute("stroke-dasharray", C.toFixed(2));
        fg.setAttribute("stroke-dashoffset", (C * (1 - pct)).toFixed(2));

        ring.classList.remove("idle");
        ring.classList.toggle("warn", pct >= 0.7 && pct < 0.9);
        ring.classList.toggle("danger", pct >= 0.9);

        document.getElementById("token-btn").title =
            "上下文用量 " + (pct * 100).toFixed(1) + "%"
            + "（" + fmtNum(msg.ctxUsed || 0) + " / " + fmtNum(msg.ctxMax) + "）"
            + "\n本会话累计 " + fmtNum(total) + " tok"
            + "\n点击查看明细";
    } else {
        // 空环 + 变淡，而不是隐藏：按钮宽度固定，工具条不会跳动
        fg.setAttribute("stroke-dashoffset", C.toFixed(2));
        ring.classList.add("idle");
        ring.classList.remove("warn", "danger");
        document.getElementById("token-btn").title =
            "本会话累计 " + fmtNum(total) + " tok\n点击查看明细";
    }

    if (document.getElementById("token-pop").classList.contains("show")) renderTokenPop();
}

function fmtNum(n) {
    if (n == null) return "0";
    if (n < 1000) return String(n);
    if (n < 1000000) return (n / 1000).toFixed(1).replace(/\.0$/, "") + "k";
    return (n / 1000000).toFixed(2).replace(/\.?0+$/, "") + "M";
}

// ═════════════════════════════════════════════════════════════════
//  消息节点构造
// ═════════════════════════════════════════════════════════════════
// ═════════════════════════════════════════════════════════════════
//  用户消息里的附件前缀
//
//  C# 的 BuildAttachmentPrefix 会把文件摘要拼进用户消息正文再发给模型。
//  实时发送时前端自己显示的是 "📎 文件名",但 restore 时读的是 C# 存的原文 ——
//  于是几千字的摘要被当成用户输入渲染成一整块大气泡。
//  这里把前缀解析回附件卡片,正文只留用户真正打的字。
// ═════════════════════════════════════════════════════════════════
const ATT_PREFIX = "[已附加文件]";
const ATT_FOOTER = "[如需精读完整内容,调用 read_uploaded_file(file_id=...)]";

function parseAttachmentPrefix(text) {
    if (!text) return null;
    if (text.indexOf(ATT_PREFIX) !== 0) return null;

    const foot = text.indexOf(ATT_FOOTER);
    if (foot < 0) return null;

    const head = text.slice(ATT_PREFIX.length, foot);
    const body = text.slice(foot + ATT_FOOTER.length).replace(/^\s+/, "");

    const files = [];
    let cur = null;
    const lines = head.split("\n");

    for (let i = 0; i < lines.length; i++) {
        const line = lines[i].replace(/\r$/, "");
        const h = line.match(/^\s*(\d+)\)\s+(.*?)\s+\((id=[^)]*)\)\s*$/);
        if (h) {
            cur = { name: h[2], meta: h[3], warn: null, summary: [] };
            files.push(cur);
            continue;
        }
        if (!cur) continue;
        if (/^\s*摘要[:：]\s*$/.test(line)) continue;
        if (/^\s*⚠/.test(line)) { cur.warn = line.trim(); continue; }
        if (line.trim() !== "") cur.summary.push(line.replace(/^ {5}/, ""));
    }

    if (files.length === 0) return null;
    return { files: files, body: body };
}

function buildAttachmentList(files) {
    const wrap = document.createElement("div");
    wrap.className = "att-list";

    for (let i = 0; i < files.length; i++) {
        const f = files[i];
        const card = document.createElement("div");
        card.className = "att-card";

        const head = document.createElement("div");
        head.className = "att-head";

        const icon = document.createElement("span");
        icon.className = "att-icon";
        icon.textContent = "📎";

        const name = document.createElement("span");
        name.className = "att-name";
        name.textContent = f.name;

        const info = document.createElement("span");
        info.className = "att-info";
        info.textContent = (f.meta || "").replace(/^id=[^,]*,\s*/, "");

        head.appendChild(icon);
        head.appendChild(name);
        head.appendChild(info);

        const hasDetail = (f.summary && f.summary.length > 0) || f.warn;
        if (hasDetail) {
            const hint = document.createElement("span");
            hint.className = "att-toggle-hint";
            hint.textContent = "▸";
            head.appendChild(hint);
            head.addEventListener("click", () => {
                const on = card.classList.toggle("expanded");
                hint.textContent = on ? "▾" : "▸";
            });
        } else {
            head.style.cursor = "default";
        }

        card.appendChild(head);

        if (hasDetail) {
            const sum = document.createElement("div");
            sum.className = "att-summary att-body";
            sum.textContent = (f.warn ? f.warn + "\n" : "") + f.summary.join("\n");
            card.appendChild(sum);
        }

        wrap.appendChild(card);
    }
    return wrap;
}

function appendMessage(uiRole, text) {
    const msg = document.createElement("div");
    msg.className = "msg " + uiRole;

    const label = document.createElement("div");
    label.className = "msg-label";
    label.textContent = uiRole === "user" ? "你"
                       : uiRole === "assistant" ? "助手" : "系统";
    msg.appendChild(label);

    const content = document.createElement("div");
    content.className = "msg-content";
    if (text) {
        const att = (uiRole === "user") ? parseAttachmentPrefix(text) : null;
        if (att) {
            // 附件前缀 → 卡片;剩下的才是用户真正输入的内容
            content.appendChild(buildAttachmentList(att.files));
            if (att.body) {
                const bodyEl = document.createElement("div");
                bodyEl.innerHTML = escapeHtml(att.body).replace(/\n/g, "<br>");
                content.appendChild(bodyEl);
            }
        } else if (uiRole === "user" || uiRole === "system") {
            // 用户/系统消息保留纯文本换行 (不做 markdown 渲染, 避免用户 * 被误解为斜体等)
            content.innerHTML = escapeHtml(text).replace(/\n/g, "<br>");
        } else {
            content.innerHTML = renderMarkdown(text);
        }
    } else {
        // 无文本 —— 气泡先隐藏(CSS display:none),后续如果收到 delta 再移除 empty 类显示。
        // 这样"仅工具调用无文本"的 assistant 消息不会显示一个空气泡。
        content.classList.add("empty");
    }
    msg.appendChild(content);

    // 操作按钮:复制(所有消息) + 撤销(仅用户消息)
    const actions = document.createElement("div");
    actions.className = "msg-actions";
    const copyBtn = document.createElement("button");
    copyBtn.className = "msg-action-btn";
    copyBtn.textContent = "复制";
    copyBtn.title = "复制本条消息内容";
    copyBtn.addEventListener("click", () => {
        const t = content.innerText || text || "";
        if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(t).then(() => {
                copyBtn.textContent = "已复制";
                setTimeout(() => { copyBtn.textContent = "复制"; }, 1200);
            }).catch(() => fallbackCopy(t, copyBtn));
        } else {
            fallbackCopy(t, copyBtn);
        }
    });
    actions.appendChild(copyBtn);

    if (uiRole === "user") {
        const undoBtn = document.createElement("button");
        undoBtn.className = "msg-action-btn undo";
        undoBtn.textContent = "撤销";
        undoBtn.title = "撤销最后一条发送(连同它的回复一起移除)";
        undoBtn.addEventListener("click", () => {
            postToHost({ type: "undoLastUser" });
        });
        actions.appendChild(undoBtn);
    }
    msg.appendChild(actions);

    document.getElementById("chat").appendChild(msg);
    if (uiRole === "assistant") state.lastAssistantMsg = msg;
    return msg;
}

function fallbackCopy(text, btn) {
    const ta = document.createElement("textarea");
    ta.value = text;
    ta.style.position = "fixed";
    ta.style.opacity = "0";
    document.body.appendChild(ta);
    ta.select();
    try { document.execCommand("copy"); btn.textContent = "已复制"; }
    catch (e) { btn.textContent = "复制失败"; }
    setTimeout(() => { btn.textContent = "复制"; }, 1200);
    document.body.removeChild(ta);
}

function addToolCallToMessage(msgEl, name, input) {
    const block = document.createElement("div");
    block.className = "tool-block collapsed";      // 默认折叠
    block.dataset.tool = name;

    const head = document.createElement("div");
    head.className = "tool-head";
    head.innerHTML =
        '<span class="tool-caret">▸</span>' +
        '<span class="tool-icon">⚙</span>' +
        '<span class="tool-name"></span>' +
        '<span class="tool-status"></span>' +
        '<span class="tool-input"></span>';
    head.querySelector(".tool-name").textContent = name;
    head.querySelector(".tool-input").textContent = input || "";

    const body = document.createElement("div");
    body.className = "tool-body";
    body.textContent = "等待结果...";

    block.appendChild(head);
    block.appendChild(body);
    head.addEventListener("click", () => block.classList.toggle("collapsed"));
    // 直接挂到 msg 下(与 msg-content 平级),让文字段和工具卡片按 DOM 追加顺序时序排列
    msgEl.appendChild(block);
    return block;
}

function addToolResultToMessage(msgEl, name, result, isErr, toolCallId) {
    const blocks = msgEl.querySelectorAll(".tool-block");
    let target = null;

    // 优先按 toolCallId 匹配 (restore 时用)
    if (toolCallId) {
        for (const b of blocks) if (b.dataset.tcId === toolCallId) { target = b; break; }
    }
    // 否则按 name + 未完成
    if (!target) {
        for (let i = blocks.length - 1; i >= 0; i--) {
            if (blocks[i].dataset.tool === name && !blocks[i].classList.contains("done")) {
                target = blocks[i];
                break;
            }
        }
    }
    if (!target && blocks.length > 0) target = blocks[blocks.length - 1];
    if (!target) return;

    target.classList.add("done");
    // 保持折叠 —— 用户想看结果自行点开
    target.classList.add("collapsed");
    const body = target.querySelector(".tool-body");
    // 工具结果含代码/坐标表,给一个复制按钮(通过委托处理点击)
    body.innerHTML =
        '<button class="tool-copy-btn" type="button">复制结果</button>' +
        '<div class="tool-body-text"></div>';
    const bodyText = body.querySelector(".tool-body-text");
    bodyText.textContent = result || "(无输出)";
    if (isErr) {
        body.classList.add("err");
        target.classList.add("err");
    }
    // 状态徽章
    const status = target.querySelector(".tool-status");
    if (status) status.textContent = isErr ? "失败" : "已完成";
}

function scrollToBottom() {
