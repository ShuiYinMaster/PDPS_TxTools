<header><div class="heading"><h1>🐳 快捷配方</h1><button class="icon" id="refresh" title="刷新配方" aria-label="刷新配方">↻</button><button class="icon" id="close" title="收起" aria-label="收起">×</button></div><div id="study">正在读取研究…</div><input id="search" type="search" placeholder="搜索名称或用途…" aria-label="搜索配方"><nav class="tabs" aria-label="配方分类"><button class="tab active" data-tab="home">常用</button><button class="tab" data-tab="recent">最近</button><button class="tab" data-tab="all">全部</button></nav></header>

<script>
'use strict';
// Markdown follows the Agent renderer; parity is checked by QuickMarkdownRegression.js.
function escapeHtml(s) {
    if (s == null) return "";
    return String(s)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#39;");
}

function renderMarkdown(text) {
    if (!text) return "";
    // 宿主 StringBuilder / Markdown 文件使用 CRLF；统一后再按行解析围栏、列表和表格。
    text = text.replace(/\r\n?/g, "\n");
    text = escapeHtml(text);

    // 1) 代码块 ```lang\ncode``` 先取出保护,避免其内容被后续规则误解
    const codeBlocks = [];
    text = text.replace(/^(`{3,}|~{3,})([\w-]*)[^\S\n]*\n([\s\S]*?)^\1[\t ]*(?=\n|$)/gm, (m, fence, lang, code) => {
        const body = code.replace(/\n$/, "");
        codeBlocks.push(
            '<div class="code-block">' +
                '<div class="code-block-head">' +
                    '<span class="code-block-lang">' + (lang || "code") + '</span>' +
                    '<button class="code-copy-btn" type="button">复制</button>' +
                '</div>' +
                '<pre><code>' + body + '</code></pre>' +
            '</div>'
        );
        return "\n\n\u0001CB" + (codeBlocks.length - 1) + "\u0001\n\n";
    });

    // 2) 行内代码 `code`
    const inlineCodes = [];
    text = text.replace(/`([^`\n]+)`/g, (m, code) => {
        inlineCodes.push('<code>' + code + '</code>');
        return "\u0001IC" + (inlineCodes.length - 1) + "\u0001";
    });

    // 3) 标题
    for (let i = 6; i >= 1; i--) {
        const re = new RegExp("^" + "#".repeat(i) + " +(.+)$", "gm");
        text = text.replace(re, "<h" + i + ">$1</h" + i + ">");
    }

    // 4) 粗体 / 斜体 (先粗后斜,避免 ** 被吃掉)
    text = text.replace(/\*\*([^\*\n]+)\*\*/g, "<strong>$1</strong>");
    text = text.replace(/(^|[^\*])\*([^\*\n]+)\*/g, "$1<em>$2</em>");

    // 5) 链接 [text](url)
    text = text.replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g,
        '<a href="$2" target="_blank" rel="noopener">$1</a>');

    // 5.5) GFM 表格
    //   | 表头1 | 表头2 |
    //   |-------|-------|
    //   | data  | data  |
    // 分隔行至少要含 -,支持 :---/---: 对齐(可选)
    text = text.replace(
        /(?:^|\n)((?:[ \t]*\|.+\|[ \t]*\n)(?:[ \t]*\|[\s|:\-]*-[\s|:\-]*\|[ \t]*\n)(?:[ \t]*\|.*\|[ \t]*\n?)*)/g,
        function (m, block) {
            const lines = block.trim().split(/\n/);
            if (lines.length < 2) return m;

            function splitRow(line) {
                let s = line.trim();
                if (s.startsWith("|")) s = s.substring(1);
                if (s.endsWith("|")) s = s.substring(0, s.length - 1);
                return s.split("|").map(function (x) { return x.trim(); });
            }

            const headers = splitRow(lines[0]);
            const aligns = splitRow(lines[1]).map(function (seg) {
                const l = seg.startsWith(":");
                const r = seg.endsWith(":");
                if (l && r) return "center";
                if (r) return "right";
                if (l) return "left";
                return null;
            });
            const rows = lines.slice(2).map(splitRow);

            let html = '<div class="md-table-wrap"><table class="md-table"><thead><tr>';
            headers.forEach(function (h, i) {
                const a = aligns[i];
                html += a ? '<th style="text-align:' + a + '">' : "<th>";
                html += h + "</th>";
            });
            html += "</tr></thead><tbody>";
            rows.forEach(function (row) {
                html += "<tr>";
                const ncols = Math.max(headers.length, row.length);
                for (let i = 0; i < ncols; i++) {
                    const a = aligns[i];
                    html += a ? '<td style="text-align:' + a + '">' : "<td>";
                    html += (row[i] != null ? row[i] : "") + "</td>";
                }
                html += "</tr>";
            });
            html += "</tbody></table></div>\n";
            return "\n" + html;
        }
    );

    // 6) 无序列表 (连续多行 - / * / +)
    text = text.replace(/(?:^[ \t]*[-*+][ \t]+.+(?:\n|$))+/gm, (m) => {
        const items = m.trim().split(/\n/)
            .map(l => "<li>" + l.replace(/^[ \t]*[-*+][ \t]+/, "") + "</li>")
            .join("");
        return "<ul>" + items + "</ul>\n";
    });

    // 7) 有序列表
    text = text.replace(/(?:^[ \t]*\d+\.[ \t]+.+(?:\n|$))+/gm, (m) => {
        const items = m.trim().split(/\n/)
            .map(l => "<li>" + l.replace(/^[ \t]*\d+\.[ \t]+/, "") + "</li>")
            .join("");
        return "<ol>" + items + "</ol>\n";
    });

    // 8) 引用 (每行以 > 开头,合并为一个 blockquote)
    text = text.replace(/(?:^&gt;[ \t]?.*(?:\n|$))+/gm, (m) => {
        const inner = m.split(/\n/).map(l => l.replace(/^&gt;[ \t]?/, "")).join("<br>");
        return "<blockquote style=\"border-left:3px solid #d1d5db;padding-left:10px;color:#6b7280;\">"
             + inner + "</blockquote>\n";
    });

    // 9) 段落 (双换行分段,块级元素独占段落)
    const parts = text.split(/\n{2,}/);
    text = parts.map(p => {
        p = p.trim();
        if (!p) return "";
        if (/^\u0001CB\d+\u0001$/.test(p)) return p;
        if (/^\s*<(h[1-6]|ul|ol|pre|blockquote|table|div)/.test(p)) return p;
        return "<p>" + p.replace(/\n/g, "<br>") + "</p>";
    }).join("\n");

    // 10) 复原代码块与行内代码
    text = text.replace(/\u0001CB(\d+)\u0001/g, (m, i) => codeBlocks[+i]);
    text = text.replace(/\u0001IC(\d+)\u0001/g, (m, i) => inlineCodes[+i]);

    // 11) 文件路径转成可点击链接
    // Quick panel keeps paths as text; the full Agent owns path-opening actions.

    return text;
}

const $=id=>document.getElementById(id);
const objectQueries={};
const state={recipes:[],favorites:[],recent:[],saved:{},study:null,tab:'home',selected:null,busy:false,runningId:null,args:{},bindings:{},results:{},schemas:{},revealResult:null};
let sequence=0; const pending=new Map();let renderedView=null;
function send(type,data={},callback){const seq=++sequence;if(callback)pending.set(seq,callback);window.chrome.webview.postMessage({type,seq,...data});return seq;}
function notice(text){$('notice').textContent=text||'';$('notice').classList.toggle('show',!!text);}
function el(tag,cls,text){const node=document.createElement(tag);if(cls)node.className=cls;if(text!==undefined)node.textContent=text;return node;}
function markdown(cls,text,preview=false){
 const node=el('div',cls+' markdown'+(preview?' md-preview':''));node.innerHTML=renderMarkdown(String(text||''));
 if(preview){node.querySelectorAll('.code-copy-btn').forEach(b=>b.remove());node.querySelectorAll('a').forEach(a=>{const span=el('span','',a.textContent);a.replaceWith(span);});}
 return node;
}
document.addEventListener('click',async event=>{
 const anchor=event.target.closest('.markdown a');
 if(anchor){event.preventDefault();event.stopPropagation();send('quick.openLink',{url:anchor.getAttribute('href')});return;}
 const button=event.target.closest('.code-copy-btn');if(!button)return;
 event.preventDefault();event.stopPropagation();const text=button.closest('.code-block').querySelector('pre code').textContent;
 try{
  if(navigator.clipboard?.writeText)await navigator.clipboard.writeText(text);
  else{const input=document.createElement('textarea');input.value=text;input.style.position='fixed';input.style.opacity='0';document.body.append(input);input.select();let ok;try{ok=document.execCommand('copy');}finally{input.remove();}if(!ok)throw Error('copy');}
  button.textContent='已复制';setTimeout(()=>{if(button.isConnected)button.textContent='复制';},1200);
 }catch{notice('复制失败，请选中代码后按 Ctrl+C。');}
});
function refresh(){send('recipe.list',{},applyList);}
function applyList(msg){
 if(!msg.ok){notice(msg.error||'配方读取失败');return;}
 if(state.study!==msg.study){state.bindings={};notice(state.study!==null?'研究已切换，请重新取对象。':'');}
 state.study=msg.study;state.recipes=msg.recipes||[];state.favorites=msg.favorites||[];state.recent=msg.recent||[];state.saved=msg.savedArgs||{};state.busy=msg.busy===true;state.runningId=msg.runningId||null;
 for(const r of state.recipes){const schema=JSON.stringify([(r.params||[]).map(p=>{const copy={...p};delete copy.objectTypes;delete copy.objectTypesLoaded;delete copy.typesLoading;return copy;}),r.actions||[]]);if(state.schemas[r.id]&&state.schemas[r.id]!==schema){delete state.args[r.id];delete state.bindings[r.id];}state.schemas[r.id]=schema;}
 if(state.selected&&!state.recipes.some(r=>r.id===state.selected))state.selected=null;
 $('study').textContent=state.study?'当前研究 · '+state.study:'当前未打开研究';$('count').textContent=state.recipes.length+' 个已固化配方';render();
}
function loadObjectTypes(r,p){
 if(p.typesLoading||state.busy)return;p.typesLoading=true;const study=state.study;let finished=false;
 const timer=setTimeout(()=>{if(finished)return;finished=true;p.typesLoading=false;p.objectTypesLoaded=true;notice('读取类型超时，可点击刷新类型重试。');render();},5000);
 send('recipe.objectTypes',{recipeId:r.id,param:p.name,study},msg=>{
  if(finished)return;finished=true;clearTimeout(timer);p.typesLoading=false;if(study!==state.study||!state.recipes.includes(r))return;p.objectTypesLoaded=true;
  if(!msg.ok){notice(msg.error||'读取场景类型失败。');render();return;}p.objectTypes=msg.objectTypes||[{label:'全部类型',value:'all'}];
  const query=objectQueries[r.id+':'+p.name];if(query&&!p.objectTypes.some(c=>c.value===query.type)){query.type='all';delete (state.bindings[r.id]||{})[p.name];}render();
 });
}
function favorite(r,button){button.disabled=true;send('recipe.favorite',{recipeId:r.id,favorite:!state.favorites.includes(r.id)},applyList);}
function card(r){
 const node=el('div','card');const open=el('button','card-main');open.append(el('span','name',r.name||r.id),markdown('desc',r.description||'打开查看参数并运行',true));
 const visible=(r.params||[]).filter(p=>!(r.actions||[]).length||!r.actions.every(a=>Object.prototype.hasOwnProperty.call(a.args||{},p.name)));const objects=visible.filter(p=>p.kind==='object'||p.kind==='objects');open.append(el('span','badge',(objects.length?'需要选择对象 · ':visible.length?'填写参数 · ':'')+((r.actions||[]).length?r.actions.length+' 个执行按钮':visible.length?visible.length+' 项参数':'无参数 · 点击运行')));
 open.onclick=()=>{state.selected=r.id;notice('');render();};const star=el('button','star'+(state.favorites.includes(r.id)?' on':''),state.favorites.includes(r.id)?'★':'☆');star.title=state.favorites.includes(r.id)?'取消收藏':'收藏配方';star.setAttribute('aria-label',star.title+' '+r.name);star.onclick=()=>favorite(r,star);node.append(open,star);return node;
}
function render(){
 const content=$('content');const view=state.selected?'detail:'+state.selected:'list:'+state.tab+':'+$('search').value;const resetScroll=view!==renderedView;renderedView=view;content.replaceChildren();document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('active',b.dataset.tab===state.tab));
 if(state.selected){const r=state.recipes.find(x=>x.id===state.selected);if(r){renderDetail(r,content);if(resetScroll)content.scrollTop=0;return;}}
 const query=$('search').value.trim().toLocaleLowerCase();let rows=state.recipes.filter(r=>!query||((r.name||'')+' '+(r.description||'')).toLocaleLowerCase().includes(query));
 function section(title,items){if(!items.length)return;content.append(el('div','section-title',title));items.forEach(r=>content.append(card(r)));}
 if(query||state.tab==='all')section(query?'搜索结果':'全部配方',rows);
 else if(state.tab==='recent')section('最近使用',state.recent.map(id=>rows.find(r=>r.id===id)).filter(Boolean));
 else{
  const favorites=state.favorites.map(id=>rows.find(r=>r.id===id)).filter(Boolean);section('置顶配方',favorites.slice(0,5));
  section('最近使用',state.recent.filter(id=>!state.favorites.includes(id)).map(id=>rows.find(r=>r.id===id)).filter(Boolean));
  if(!favorites.length&&!state.recent.length)section('点击 ☆ 收藏常用配方',rows.slice(0,5));
 }
 if(!content.childNodes.length)content.append(el('div','empty',query?'没有找到匹配的配方':state.recipes.length?'还没有最近使用的配方':'还没有已固化配方\n可从“配方管理”中添加'));
 if(resetScroll)content.scrollTop=0;
}
function renderDetail(r,content){
 const heading=el('div','detail-title');const back=el('button','icon','‹');back.title='返回列表';back.onclick=()=>{state.selected=null;render();};heading.append(back,el('h2','',r.name||r.id));const star=el('button','star'+(state.favorites.includes(r.id)?' on':''),state.favorites.includes(r.id)?'★':'☆');star.title='收藏 / 取消收藏';star.onclick=()=>favorite(r,star);heading.append(star);content.append(heading,markdown('purpose',r.description||'检查参数和目标对象后运行。'));
 const args=state.args[r.id]||(state.args[r.id]={...state.saved[r.id]});const bindings=state.bindings[r.id]||(state.bindings[r.id]={});
 const actions=(r.actions||[]).length?r.actions:[null];const runs=actions.map((action,i)=>{const button=el('button','primary',state.busy?'执行中…':action?action.label:'运行配方');button.id=i?'run-'+action.id:'run';return {button,action};});const run=runs[0].button;const hint=el('div','', '');hint.id='run-hint';
 function fixed(p){return (r.actions||[]).length>0&&r.actions.every(a=>Object.prototype.hasOwnProperty.call(a.args||{},p.name));}
 function value(p,action){return action&&Object.prototype.hasOwnProperty.call(action.args||{},p.name)?action.args[p.name]:args[p.name];}
 function ready(action){return (r.params||[]).every(p=>{
  if(p.kind==='object'||p.kind==='objects')return !p.required||!!bindings[p.name];
  const v=value(p,action);if(v===undefined||String(v).trim()==='')return !p.required;

 if((r.params||[]).some(p=>p.kind!=='object'&&p.kind!=='objects'&&!fixed(p))){const reset=el('button','icon','恢复默认值');reset.disabled=state.busy;reset.onclick=()=>{for(const p of r.params||[])if(p.kind!=='object'&&p.kind!=='objects')args[p.name]=p.def!=null?p.def:(p.kind==='bool'?'false':'');render();};content.append(reset);}
